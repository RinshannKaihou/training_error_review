    stack: torch_npu
    component: fill_diagonal_ 注册
  behavior: op_plugin 把 fill_diagonal_ 注册到 AutogradPrivateUse1，绕过 CompositeImplicitAutograd 分解，未挂 CopySlices 反向节点，对角线梯度未被屏蔽。
effect:
  objects:
  - 梯度

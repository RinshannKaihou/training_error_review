id: TRN-0618
legacy_ids: []
slug: opstransformer_flashattn_masked_sink_lse
aliases: []
title: FlashAttn 全 masked 块跳过致 sink 行 LSE 错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: flash_attn sink 初始化
  behavior: ClearOutput 把 LSE 全部初始化为 +inf，GetTaskDealMode 整块跳过无可见 KV 的 query 块，跳过块不经过 sink 初始化与 LSE 写回，保留 +inf 而非 sink[head]。
effect:
  objects:
  - 数值结果
  detail: 滑动窗口+因果 mask 下全 masked 有效 query 行 LSE 返回 +inf（应 sink[head]），同类行结果依赖分块边界；原始 case LSE 匹配率 73.66%，错 24576/93312 元素，attention 匹配率 99.9988%。
  visibility: 数值异常
mitigation:
  detect: 构造 win_left/win_right 使部分 query 全 masked 的 LSE 用例（原始 case Prefill_FP16_..._Mask_200029：seqused_kv=[5184,67,67]、win 2166/2996）；新增回归 test_masked_sink_lse.py 48 例。
  fix: 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/15277（open）：有 sink 时初始 LSE 为 head 的 sink、被跳过块自然保留正确值；arch35 已实测恢复 100%，arch92 待真机；附 100-case 性能回归存在可复现劣化。未发布。

id: TRN-0622
legacy_ids: []
slug: opsnn_indexadd_v2_empty_index_unwritten
aliases: []
title: IndexAddV2 空 index 返回成功但输出未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnIndexAddV2 空输入路径
  behavior: 两条实现（mode==0 AiCore/mode!=0 AiCpu）均无空 index 早退写输出处理：合法退化输入两段 rc=0 但 out 一个字节未写。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: index 长度 0（source 对应 dim 维同为 0，合法）时接口返回 0，但 out 一个字节未写，保持预填哨兵 0xA5/未初始化内存（实测 48/48 字节未变）；数学上应等于 self，V1 同输入正确。dim=0/-1、fp32/fp16、mode=0/1 四组合均可复现。
  visibility: 静默错误
mitigation:
  detect: 空 index 用例预填 device 哨兵字节后调 V2 检查 out 是否等于 self；对比 V1 行为。
  fix: 待定（issue 建议 P0：空 index 早退写 out=self 或第一段显式报 ACLNN_ERR_PARAM_INVALID；修复载体未见）。
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-05'
remarks: 训练侧重申合并条目（推理库 INF-2389 同源已收训练+推理 scope）：index_add 是 embedding 梯度散射/优化器更新路径标准算子，空 index 训练步直接拿脏数据当成功。
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/8102
  kind: gitcode_issue

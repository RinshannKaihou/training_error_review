remarks: '「优化静默不生效」类：无错值但融合门控系统性失效；收录为性能/资源静默失效面。仓内注释自证（fused_mat_mul_fusion_pass.cpp: the Ascend950 ini has no arch_type at all, which blocked the real 950 device）。'

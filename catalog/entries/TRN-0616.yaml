    component: 通信 fallback 注册覆盖
  behavior: 后端激活时批量注册的通用 fallback 覆盖 _c10d_functional 通信/等待 lowering，IR 丢失通信依赖与缓冲区生命周期，内存复用让第二次通信覆写在途的第一次通信结果。

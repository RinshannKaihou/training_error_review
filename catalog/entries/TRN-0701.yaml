original:
  mechanism: 'huggingface/trl #8176（open，2026-11-08，commit 4ae4d34a86f3）：DPOTrainer 的 SFT 贡献随梯度累积划分变化——同一有效 batch、同初始权重与种子，batch_size=2+gradient_accumulation_steps=1 与 batch_size=1+gradient_accumulation_steps=2 产生不同梯度；不等长 chosen 响应下 SFT loss 权重按微批平均所致，文档化 MPO 配方受影响。复现：六组单步 CPU 训练对照（snapshot_download pinned trl-internal-testing/tiny-Qwen2ForCausalLM-2.5、同 examples/seed/有效 batch、clip 关闭、on_pre_optimizer_step 捕获全参数梯度）。与 TRN-0173（swift DAPO 双除 G）/TRN-0688（swift label_smoothing 微批均值）同族：归一化域/累积错配。'
  source: https://github.com/huggingface/trl/issues/8176
  behavior: 用 DPOTrainer（含 SFT 辅助 loss / MPO 配方）训练不等长 completion 数据：保持有效 batch 不变、只改 per_device_train_batch_size 与 gradient_accumulation_steps 的划分，一步的梯度就不同——调参与复现实验对累积步数不再不变，结果悄悄漂移；无报错，需固定划分对照捕获梯度才能发现。
  trigger_surface: trl @4ae4d34a；DPOTrainer + SFT 辅助 loss + 不等长 chosen/rejected

original:
  mechanism: 'huggingface/trl #8212（2026-11-10，open，实测 A/B 各一臂）。SkyRL（use_cache_salt）与 prime-rl 已按策略版本 salt 前缀缓存，TRL 未做。机制：权重同步不失效前缀缓存 → 共享前缀的 rollout 部分基于陈旧策略 KV 计算 → rollout↔train 一致性被破坏且不可观测（kl 指标本身被污染）。'
  source: https://github.com/huggingface/trl/issues/8212
  behavior: AsyncGRPO 训练里带长共享前缀（system prompt/工具 schema）时，每次权重同步后 rollout 仍在用第一次那组权重算出的前缀 KV：实测 KL 指标虚高 80 倍（0.082 vs 0.0010）、采样掩码错误率 3.2%；训练照常进行、指标看似合理，实际 rollout 与当前策略不一致，on-policy 假设被静默破坏。

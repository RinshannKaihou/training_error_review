original:
  mechanism: 'cann/hcomm #1122（2026-10-24，open）：AllReduceOperator::DeterministicSelector 中判断数据切分是否对齐的阈值使用了 deviceNumPerAggregation_（每聚合域设备数），但确定性 pipeline 算法的数据切分应按 userRankSize_（参与通信的总 rank 数）对齐；在聚合域设备数与总 rank 数不一致的部署形态（多聚合域组网）下，切分对齐判断错误，特定规模下确定性 allreduce 的数据切分偏离预期。issue 正文与修复 MR !6258/!6259 描述一致，改动文件 src/legacy/ascend910/algorithm/impl/operator/all_reduce_operator.cc，将阈值判断中的 deviceNumPerAggregation_ 改为 userRankSize_。上游以文字描述定位到具体函数与变量，未附数值对拍数据；机制定位明确但训练侧具体错值形态未见量化（无 max|diff| 数据）。'
  source: https://gitcode.com/cann/hcomm/issues/1122 ；修复 https://gitcode.com/cann/hcomm/pull/6258 、https://gitcode.com/cann/hcomm/pull/6259
  behavior: 使用确定性 allreduce 的分布式训练作业在特定机器/rank 规模下运行正常无报错，但梯度归约结果与正确值有偏差：作业不崩、loss 曲线可能看不出突变，模型更新方向偏离。触发条件是聚合域设备数与参与 allreduce 的总 rank 数不同的部署（如多 die/多聚合域组网）；文档未给具体规模阈值。
  trigger_surface: 确定性 allreduce（HCCL deterministic pipeline）+ 聚合域设备数 ≠ 总 rank 数的组网；Ascend 910 系 legacy 算法路径。
  discovery: 2026-10-25 每日扫描

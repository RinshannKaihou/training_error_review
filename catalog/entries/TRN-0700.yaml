original:
  mechanism: 'cann/ops-nn #8415+!13530（issue closed 2026-11-09，修复前 master@3080cd900ad7，Ascend950 arch35）：softsign_grad 校验链缺失——InferShape 未读取/校验第二输入 features 的 shape（无 rank 一致性、逐维冲突、rank≤8 上限、UnknownRank 传播，输出直接取 *gradients_shape）；InferDataType 无 dtype 域（FP16/FP32/BF16）与双输入一致性校验、直接透传输入 0 dtype，且经 IMPL_OP_INFERSHAPE 与 op_graph 双注册同一槽位、生效实现取决于库加载顺序（不确定性缺陷）；tiling 无 rank≤8/IsUnknownShape/逐维非负/输出 dtype 域与一致性/format 三向 ND 校验。上板实测：complex128 输出产出错误结果、fp16 输出触发设备 VEC_ERROR、FRACTAL_NZ format 全链路静默接受并计算；空 tensor（totalNum=0）反而被 tiling 报错拒绝（家族算子 celu/relu6 惯例支持空 tensor 早退）。修复补全各级校验门+空 tensor 早退+注册收敛，三轮全量回归零精度失败。与 TRN-0676 同族：越域出参 dtype/元数据未在校验门拦截静默错果。'
  source: https://gitcode.com/cann/ops-nn/issues/8415
  behavior: 对 softsign_grad 传入越域输入（complex128 输出、FRACTAL_NZ format、rank9 或 gradients/features dtype 混配）：全链路无拒绝、无日志，算子静默计算并产出错误结果（complex128 实测错值，NZ format 照算）；fp16 输出则触发设备 VEC_ERROR。合法空 tensor 反被「empty shape is not supported」拒绝。错误结果看似有效数值、与标杆对拍才暴露；双注册使不同环境生效的推导实现不同，行为随库加载顺序漂移。
  trigger_surface: Ascend950 arch35、ops-nn master@3080cd9（修复前）；越域 dtype/format/shape 输入或空 tensor

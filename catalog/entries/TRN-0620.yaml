original:
  mechanism: 'cann/ops-nn #8068（2026-11-04 closed）+ 修复 MR !13572（merged）：conv2d_v2 在 small kernel 场景下 pad 与 kernel 尺寸相等（1x1 卷积核 pad 5）导致精度完全错误。复现参数（社区最新 CANN 包，Ascend950）：fmap 19,21,1,8；weight 21,8,1,8；pad 1 1 5 5；stride 3 3；dilation 5 1；fp16。修复 MR !13572『fix(conv2d_v2): small kernel 拒绝 pad >= kernel 场景修复精度全错』已 merged（批次快照 2026-11-04T01:34 状态 merged），拒绝非法组合而非静默计算。issue 正文较薄（一行+截图），机制细节（tiling 具体哪一步错）上游未公布；精度全错由截图与修复 MR 标题/描述证实。此前 11-04 留观的 !13477（PR 描述空、同标题模式）即本机制，本轮证据链闭合。训练侧：conv2d 为视觉/多模态训练标准算子，fp16 合法 shape 组合下输出全错且无报错。'
  source: https://gitcode.com/cann/ops-nn/issues/8068 ｜修复 MR：https://gitcode.com/cann/ops-nn/merge_requests/13572
  behavior: NPU 上跑 fp16 conv2d，1x1 小卷积核配较大 pad（pad=kernel，如 pad 5）且带 dilation/stride 组合时，输出与 CPU 参考完全不符、精度判据全挂，但算子正常返回无任何报错；训练 loss 从第一步就异常或完全训不动，换 CPU/GPU 或避开该 pad 组合即正常。11-04 留观、本轮修复 merged 转收。
  trigger_surface: CANN conv2d_v2 small kernel 路径 + pad 尺寸 >= kernel（实测 1x1 核 pad 5）+ fp16 + Ascend950；dilation/stride 组合（5 1 / 3 3）

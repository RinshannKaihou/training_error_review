title: batch_norm_grad_v3 arch35 dgamma 多次舍入超阈
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 优化器
    stack: cann
    component: dgamma/dx 归约舍入
  behavior: dgamma 归约被加项三次分立舍入（(x−mean)→×dy→×rstd，rstd 混在段内逐项相乘）舍入源偏多；dx 强抵消元素误差由 dgamma 误差主导。
effect:
  objects:
  - 梯度
  detail: arch35 fp32 训练反向部分用例误差比值超阈（dx 12.28>10、dgamma 2.32>2.0）；绝对精度正常（~1e-7）。修复后 90/90 PASS，小 C 长 R 形状仍有约 1/5 超阈残留。
  visibility: 静默错误
mitigation:
  detect: fp64 真值对照的三方精度 benchmark（cv_fused_double_benchmark）；dgamma 误差比值按形状分布监控。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/10979（merged，2026-11-06 快照）：dgamma 先归约后乘 rstd（全 6 条 kernel 路径）、FullLoad 对折乘加改 MulAddDst 单次舍入、dx 标量结构预合并 grad_scale、SplitR1 FoldVF tail 修复；残留小 C 长 R 约 1/5 超阈待后续（融合乘加覆盖 LessThanVL 或长归约升级累加精度）。发布未核实。

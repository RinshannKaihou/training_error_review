original:
  mechanism: 'ops-nn #8393（open；A2/A3）+ 修复 !13909（open）：NonZero kernel 在 rank>1 路径上 IsNonZero 按原始位模式判零（uint16/uint32 != 0），而 -0.0 的位模式非零（fp16/bf16 为 0x8000、fp32 为 0x80000000），被误判为非零导致输出坐标错位——修复描述明确『输出包含 -0.0 必重现』。修复方法：浮点判零前屏蔽符号位（2B 用 0x7FFF、4B 用 0x7FFFFFFF）；arch22 AiCore 仅支持 BOOL/FLOAT16/BF16/FLOAT/INT8/UINT8，故 2B 必为 fp16/bf16、4B 必为 fp32；1B（bool/int8/uint8）无符号位语义保持原样。测试：-0.0 最小复现（fp16/bf16/fp32×6 形状+bool/int8/uint8）21/21 通过、全量泛化 433/433 通过。'
  source: https://gitcode.com/cann/ops-nn/issues/8393 ｜ 修复 PR：https://gitcode.com/cann/ops-nn/merge_requests/13909
  behavior: A2/A3 上对含 -0.0 的浮点张量（fp16/bf16/fp32）调用 non_zero（rank>1 路径）：-0.0 被当作非零元素返回坐标，输出坐标与正确结果错位——下游按坐标索引取值、做 mask 或统计非零个数时拿到错误结果；无报错，输出含 -0.0 即必现。
  trigger_surface: Ascend A2/A3；NonZero kernel rank>1 路径 + 输入含 -0.0（fp16/bf16/fp32）
  discovery: 2026-11-09 每日扫描

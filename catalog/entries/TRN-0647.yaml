title: matmul 融合 pass 真机 950 平台判断失效
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: 融合 pass 平台判断 arch_type
  behavior: 平台门控读 soc_info.arch_type，真机 950 ini 无该字段，比较恒 false，3510 系列被误判不支持。
effect:
  objects:
  - 性能/资源
  detail: 真机 950 上 FusedMatMul 融合/PostCube 派发不走、量化类 infershape 判断与 anti_quant/transpose 融合门控失效——优化静默不生效，数值不受损。
  visibility: 性能退化
mitigation:
  detect: 融合日志（FusedMatMul 命中计数）与预期平台对照；直接断点 IsNpuArch3510Series 返回值。
  fix: 修复方案（issue 正文）：平台判断改用运行时 API aclplatformGetDeviceInfo(ACL_PLATFORM_NPU_ARCH) 取 arch 字符串 atoi 比较，配 UT stub；关联修复 MR 见 issue（状态未在批次快照核实）。

remarks: 推理库 INF-2377（ForeachNorm 非 1/2 阶）/INF-2379（NaN 指数当 0 次幂）已按推理范围收录；本条为训练侧重申合并条目：torch._foreach_norm/_foreach_pow 是训练侧 fused 优化器/梯度裁剪/clip_grad_norm_ 的 foreach 路径入口，训练侧影响成立（clip_grad_norm_ 的 foreach 实现即调 _foreach_norm）。

slug: deepspeed_autotp_replicated_kv_grad_norm_double_count
aliases: []
title: AutoTP 复制 K/V 行进全局梯度范数，clip 阈值被放大 TP 倍
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: clip_grad_norm_ TP 计数
  behavior: K/V 块每 TP rank 复制一份且被标 tensor_model_parallel，clip_grad_norm_ 本地范数后对 TP 组 all-reduce 求和，复制行计 TP 次。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: 全局梯度范数被多算 (TP-1) 份 K/V 行平方和，clip 系数被压低 → K/V 行有效学习率被低估、更新量被过度缩放；2-norm 默认路径受害，inf 分支不受影响；ZeRO-3 分区组跨 TP 时路径差异另述。
  visibility: 静默错误
mitigation:
  detect: 关 clip 时 TP>1 与单卡梯度对齐（#8962 修复后已可对齐）再开 clip 对比范数；直接检查 all-reduce 前各 rank K/V 行范数是否重复。
  fix: 待定：issue open（2026-11-06），明确指出为 pre-existing norm-accounting 问题、#8962 不改 clipping 路径，未见修复 PR。

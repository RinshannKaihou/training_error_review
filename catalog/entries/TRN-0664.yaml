id: TRN-0664
legacy_ids: []
slug: verl_rollout_logprob_refit_last_round_only
aliases: []
title: verl rollout logprob 对拍只查末轮假 PASS
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 观测/评测
    stack: verl
    component: rollout_logprob_diff 脚本
  behavior: scripts/rollout_logprob_diff.py --refit-rounds N 记录每一轮但只检查最后一轮摘要：早期 refit 轮可超阈值或产出非有限指标，最终轮健康即返回成功。
effect:
  objects:
  - 测试判定
  - 训练信号
  detail: round 1 失败 round 2-3 恢复时脚本打印 PASSED 退出 0；原脚本 27 个新测试中 17 个证实假成功退出码；QAT/低精度对齐验收结果失真。
  visibility: 静默错误
mitigation:
  detect: 对每轮 refit_runs 历史断言 finite kl 与 k3_kl<阈值；检查退出码与逐轮记录一致性。
  fix: 修复 PR https://github.com/verl-project/verl/pull/8564（open 2026-11-05）：校验每个已记录轮次（finite kl/k3_kl + k3_kl<--max-k3-kl），任一轮失败即失败并报轮号与指标；29 项 CPU 回归（原始脚本 27 失败/2 过）。未合。

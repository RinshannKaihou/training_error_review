    component: ZeRO-1 allreduce_bucket
  behavior: ZeRO-1+16bit 模型+fp32 梯度累积时，fp32 窗口和在 all-reduce 边界被一次性舍入到 communication_data_type（默认随模型 bf16），累积精度丢弃。

mitigation:
  detect: values 与 sequence dtype 不一致的组合与 CPU 对账；越界读可用 guard region 探测。
  fix: 修复 PR https://gitcode.com/cann/ops-math/issues/4616（标题为修复方向：reject mismatched input dtypes before reading values，open 2026-11-07，未见代码落地）。未发布。

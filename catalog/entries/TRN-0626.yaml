original:
  mechanism: 'Ascend/pytorch !49041（2026-11-04 open，合入来源 issue #5755）：default 后端（TORCHINDUCTOR_NPU_BACKEND=default）online softmax 套件验证发现两类问题：(1) NPUIndexTritonKernel.reduction() 为 vendor 重实现，丢失上游 TritonKernel.reduction() 的 online_softmax_reduce 循环携带分支——循环形态（归约长度超 persistent 阈值或 dim=0 外层归约）无法生成在线 softmax kernel，形态断言失败被 combined scheduling 的 except Exception: log.debug 吞掉后静默回落经典两遍形式（数值近似正确但在线 softmax 机制失效，性能退化）；(2) triton_helpers 两处语义偏差：_extremum 用 tl.min 实现（vendor tl.min 绑定缺 propagate_nan kwarg），NaN 传播语义与 eager 不符；max_with_index/min_with_index 命中掩码缺 value!=value，NaN 行索引与 eager argmax/argmin 错位。修复：新增 online_softmax_reduce/combine 包装（丢弃 strict_signed_zero，bishengir 无法编译 strict reduce）、_extremum 浮点改 -tl.max(-value,propagate_nan=True) 等价实现、掩码补 value!=value、reduction() 补循环携带分支、should_use_persistent_reduction 对 online 强制 False。验证：Ascend NPU 910B4、CANN 9.2.0-beta.2、triton-ascend 3.6.0，default 后端 75 项 73 PASS/0 FAIL/2 ERROR（2 ERROR 为已知独立缺陷）；TE 后端 63 PASS/4 FAIL/8 ERROR 与合入前基线一致零回归。NaN 语义错位为静默错值面：训练图含 NaN 输入（如 SDC/溢出后）时 max/argmax 结果与 eager 分叉。'
  source: https://gitcode.com/Ascend/pytorch/merge_requests/49041 ｜关联 issue：https://gitcode.com/Ascend/pytorch/issues/5755
  behavior: NPU torch.compile（default 后端）下含 NaN 的输入做 max/min/argmax/argmin 时结果与 eager 不一致（NaN 不传播、NaN 行索引取错位置），无报错；训练出现 NaN 后依赖这些归约的图（softmax/异常检测路径）行为与 eager 版本分叉，掩盖或放大 NaN 影响。另长归约 online softmax 静默退化为两遍形式（数值近似正确、性能掉）。修复后 73 项套件全过。
  trigger_surface: torch_npu Inductor default 后端 + 含 NaN 输入的 max/min/argmax/argmin + online softmax 长归约；910B4/CANN 9.2.0-beta.2/triton-ascend 3.6.0

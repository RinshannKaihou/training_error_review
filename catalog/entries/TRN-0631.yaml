    component: ForeachExpm1 tensorNum 校验
  behavior: 对 tensorNum>256 无校验：tiling 对定长 256 数组按 i<tensorNum 逐项写入发生 host 侧越界写；kernel 以 tensorCount 索引同一数组，index≥256 的张量不参与计算。

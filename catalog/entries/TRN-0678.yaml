title: graph bridge 常量浮点输出被标记可微
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: graph bridge 常量输出标志
  behavior: 自定义 Autograd Function 的 forward 未调用 mark_non_differentiable，原本不需要梯度的浮点常量输出被赋予 requires_grad=True 和 grad_fn
effect:
  objects:
  - 梯度
  detail: 常量 loss 的 backward 在 eager 应拒绝而 bridge 会执行无数据贡献的反向，甚至创建零参数梯度；与 weight decay 交互引入多余更新
  visibility: 静默错误
mitigation:
  detect: 检查 (x*w, ones_like(x)) 型混合输出在 bridge 下第二输出的 requires_grad 标志
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49263（open，未发布）：capture 时保留 requires_grad 标志并对分离输出 mark_non_differentiable

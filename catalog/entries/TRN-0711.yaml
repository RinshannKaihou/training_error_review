original:
  mechanism: 'ops-nn #8561（2026-11-10，open，910B3 / CANN 9.2.0 / master e21941a02）。缺陷位置 index/gather_v3/op_host/op_api/gather_v3.cpp 只校验 dtype/shape；C++ repro（aclnnGatherGetWorkspaceSize/aclnnGather 直调）实测越界 index 返回 [100, 0.0]，kernel assert ''Index 99 out of range[0 4)'' 已触发并写 plog 但未拦截。上游索引越界在训练里常由配置/数据错位引入（如词表越界、路由错位），本缺陷使其以静默错值而非报错暴露。'
  source: https://gitcode.com/cann/ops-nn/issues/8561
  behavior: 调用 aclnnGather 时若 index 含越界值（上游 bug 或配置错位的症状），不报 161002：接口返回 0，输出张量里越界位置变成相邻内存值或 0.0 等看似合理的数；只有翻 plog 才能看到 kernel assert 已记录，训练/推理静默继续用错值。
  discovery: 2026-11-11 每日扫描

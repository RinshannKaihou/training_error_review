original:
  mechanism: 'cann/ops-math issue #3626 + MR !6428（2026-10-16）。Ascend 950 RaggedBinCount host tiling 未消费 GE 确定性选项：非二值加权场景显式开启 ge.deterministic=1 后仍可能走浮点 atomic 累加，同一输入多次执行输出位模式不同（本地冻结输入 SHA256 核验后源码基线 3 次 MD5 不一致；应用修复 PR 后两条冻结用例各 10 次 MD5 一致）。原始反馈来自 wangyueting/changwei_sunyibo/issues/5（无现场 SHA/seed/冻结输入，本地以相同输入验证，不等同现场逐字节复现）。issue 内附最终回归更新：受测提交 d6656c0，A100 三方默认/确定性各 100 条 200/200 通过、回归 3189 条次、插桩越界/竞争 90 次无错误；后续 PR 范围调整（撤销 README）与 Host UT ABI 兼容修复（73e9d70）均如实分账，线上 CI 已启动未完结。默认模式浮点归约允许不同累加顺序是预期行为；本条收录的是显式确定性请求未满足。'

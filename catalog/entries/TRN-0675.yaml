    component: NonZero IsNonZero 判零
  behavior: IsNonZero 按原始位模式判零（uint16/uint32 != 0），-0.0 位模式（0x8000/0x80000000）非零被误判为非零
effect:
  objects:
  - 数值结果
  detail: 含 -0.0 的输入输出坐标错位：-0.0 被当作非零元素计入 non_zero_coordinates；修复后符号位屏蔽 21/21、全量 433/433 通过

relations: []
original:
  mechanism: 'ms-swift issue #10519（2026-11-05 open；main @ 9853e46）+ 修复 PR !10520（open）。--streaming true + Megatron 后端 resume 时，训练流从位置 0 重启而非快进过已消费样本。根因：swift/megatron/trainers/base.py 的 _prepare_dataloader 在 streaming 分支 build_streaming_dataloader 后直接 return，不带任何 resume 信息（非 streaming 路径用 consumed_samples 线程进 batch sampler）；skip 基础设施已存在但不可达——DataLoaderDispatcher.__init__(skip_batches=0) 与 _skip_batches 已能按 world_size 基批快进，而 build_streaming_dataloader（swift/megatron/trainers/utils.py）构造 MegatronDataLoaderDispatcher 时不传 skip_batches。影响：生产中断恢复后静默重训上次 ckpt 以来全部样本——1200 步 ckpt 间隔、~3.7s/step 下每 rank 重放约 74 分钟数据；流式数据集无法事后 seek，唯一症状是 resume 后 loss 回退。来源：https://github.com/modelscope/ms-swift/issues/10519 、修复 https://github.com/modelscope/ms-swift/pull/10520 。训练面：所有中断的流式训练作业的默认 resume 路径。'
  source: https://github.com/modelscope/ms-swift/issues/10519 ｜修复 PR：https://github.com/modelscope/ms-swift/pull/10520
  behavior: 用 ms-swift Megatron 后端跑流式数据集（--streaming true）并从 checkpoint 恢复训练时：数据流从第 0 条重新开始而不是跳过已训练的部分，上次保存 checkpoint 之后看过的每个样本都被再训一遍——无报错无警告（流式数据不能回看，事后也无法核对），唯一可见症状是 resume 后 loss 突然回退再降；生产实测一次恢复静默重放约 74 分钟/卡的数据。
  trigger_surface: ms-swift --streaming true + Megatron 后端 + resume；修复 !10520 open 未合
  discovery: 2026-11-12 每日扫描

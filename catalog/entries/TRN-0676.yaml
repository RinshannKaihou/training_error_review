original:
  mechanism: 'ops-nn #8386（open；Atlas A2 910B2、CANN 9.3.0、master aba3533d，2026-11-08 复核仍在）：aclnnUnique 的 CheckDtypeValid(self, inverseOut) 参数列表不含 valueOut（:39-45），CheckParams 对 valueOut 仅判空；valueOut 建成 ACL_COMPLEX64 时两段均 0，底层按 self 的 INT32 4 字节连续写入，读回前 4 个 32 位字为 1,2,3,canary——调用方按 COMPLEX64 解释时元素 0 读成 (1,2)、元素 1 读成 (3,2139062143)，元素边界与语义整体错位。负向对照 valueOut=STRING 仍返回 0，证明该接口对 valueOut 的 dtype 完全没有校验；×8 卡与 CANN 9.2.0 复跑逐字相同排除环境因素。ops-math #4618（open；master 21016019/aae0dcf0）：aclnnMaxDim 的 indices 只允许 INT32/INT64，CheckDtypeValid(self, out) 不含 indices；indices=ACL_FLOAT 两段 0 并把索引以 float 写回 1.0/0.0；负向对照 indices=STRING 报 161001 证明白名单存在但漏了 FLOAT。修复：ops-nn !13900（open）Reject mismatched valueOut dtype in aclnnUnique；MaxDim 未见修复。与 TRN-0669（首段 dtype 校验缺口放行到执行段报内部错）同族，本例静默按错误语义写回。'
  source: https://gitcode.com/cann/ops-nn/issues/8386 ｜ https://gitcode.com/cann/ops-math/issues/4618 ｜ 修复 PR（Unique）：https://gitcode.com/cann/ops-nn/merge_requests/13900
  behavior: 把 aclnnUnique 的 valueOut 声明成白名单外的类型（如 COMPLEX64）或 aclnnMaxDim 的 indices 声明成 FLOAT：两段 API 都返回成功并正常执行——Unique 按 self 的 4 字节 INT32 写回 8 字节 COMPLEX64 输出（调用方解释出的元素完全错位），MaxDim 把整数索引写成 1.0/0.0 浮点值；无 161002、无告警，跨卡跨小版本稳定复现。
  trigger_surface: Atlas A2 910B2、CANN 9.2.0/9.3.0；aclnnUnique valueOut 或 aclnnMaxDim indices 传白名单外 dtype

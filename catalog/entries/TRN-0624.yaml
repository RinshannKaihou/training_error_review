id: TRN-0624
legacy_ids: []
slug: triton_ascend_i64_i32_floor_divide_zero
aliases: []
title: triton-ascend 混合整数除法正数静默返 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton-ascend
    component: i64//i32 整数除法编译
  behavior: triton-ascend 对 i64//i32 混合整数除法误编译：正数操作数静默返回 0（7//3→0），编译期不报错、运行期才暴露数值错误。
effect:
  objects:
  - 数值结果
  detail: 正数整除结果全为 0，索引/掩码/分桶等整数逻辑静默错；AOTI/cpp_wrapper 的 triton_experimental 后端场景被 torch_npu 路由规避。
  visibility: 静默错误
mitigation:
  detect: 整数 floor_divide 边界单测（7//3、SymInt/sympy 整型除数）；host 契约 UT 验证整数路径走 ATen 回退。
  fix: 规避 PR https://gitcode.com/Ascend/pytorch/merge_requests/49022（open）：triton_experimental lowering.py 整数 floor_divide 与 div(floor) 整体回退 ATen/aclnn，浮点保持 triton 融合；牺牲整数除法融合机会换正确性。triton-ascend 侧根因未定位。未发布。
labels:
  stage:
  - shared
  confidence: documented
  coverage: var
  discovered: '2026-11-05'
remarks: 与 TRN-0280/TRN-0617/TRN-0623 同 NPU 编译器静默错值族：此条是 triton-ascend 整数语义误编译，torch_npu 侧规避。

original:
  mechanism: 'DeepSpeed issue #9047（2026-11-10 open，审阅 #9044 时发现）。ZeRO-1 + 16bit 模型 + grad_accum_dtype: fp32：每 rank 的梯度窗口在 param.grad_accum（fp32，use_grad_accum_attribute）中累加，setup_buckets/_gradient_reduction_buffer_dtype 把 IPG bucket 也配成 fp32（拷贝精确）；但窗口边界 average_tensor/allreduce_bucket（DeepSpeedZeroOptimizer.allreduce_bucket 与 gradient_reduction_w_predivide）把和 cast 到 communication_data_type（bf16 模型默认 bf16）再 all_reduce——fp32 窗口和在归约前被一次性舍入，额外累积精度在归约处丢弃。ZeRO-2 同配置逐微步 reduce 后累加进 fp32 分区，对 bf16 精确输入窗口和精确；ZeRO-1 不精确。复现：tests/unit/v1/zero/test_zero_offload_accum_precision.py，16 微步、梯度在 bf16 精确：stage2 误差 0，stage1 相对最大误差 2.4e-3；同值在 a4c989b7 已存在（非 #9044 回归）。提案：communication_data_type 未显式设置时按 gradient_accumulation_dtype 归约。来源：https://github.com/deepspeedai/DeepSpeed/issues/9047 。训练面：所有 ZeRO-1+fp32 梯度累积的 16bit 训练每步窗口和带 ~1e-3 级相对偏差。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/9047
  behavior: 用 ZeRO-1 训练 16bit 模型并显式配 fp32 梯度累积时：每 rank 的 fp32 累积看似生效（IPG bucket 也是 fp32），但在 all-reduce 边界整个窗口和被舍回 bf16（通信 dtype 默认跟随模型 dtype）再归约——fp32 累积的精度收益在每步归约处静默丢失，实测窗口和相对最大误差 2.4e-3（ZeRO-2 同配置为 0），无报错，梯度长期带偏。
  trigger_surface: DeepSpeed ZeRO-1 + 16bit 模型 + grad_accum_dtype fp32 + communication_data_type 未显式设置；issue open 无修复
  discovery: 2026-11-12 每日扫描

mitigation:
  detect: 对同一 logits 加减公共常数后比对 entropy 与 d(entropy)/d(logits)；理论上应不变，实测会变即命中
  fix: 修复 PR https://github.com/OpenRLHF/OpenRLHF/pull/1411 （open）：改用 log_softmax 与概率计算，零概率项的 log prob 置 0 以保持 0*log0 极限；新增 33 例（主干 27 失败）

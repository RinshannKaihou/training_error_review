id: TRN-0719
legacy_ids: []
slug: torch_npu_rsplit_no_combine_uninit_output
aliases: []
title: torch_npu 双归约不同轴长第二个归约输出未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: inductor rsplit 配对
  behavior: 同一图两个归约轴长不同时第二个归约走 rsplit 只写 workspace，但 npu_rsplit_partial 的 4 处赋值只有 1 处设置 rsplit_kernel，其余路径不生成 combine kernel
effect:
  objects:
  - 数值结果
  detail: torch.compile 编译的函数中同一张图有两个归约且归约轴长度不同（如 sum 两次、维度不同）时，第二个归约输出为未初始化显存，值像随机垃圾（实测 maxdiff 178.66），不报错；只算单个归约或两个归约轴长相同则完全正常，复现稳定；修复 !49440
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/pull/49440 （open，WIP，未发布）

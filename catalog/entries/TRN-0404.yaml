    component: AllReduceOperator::Determ
  behavior: 确定性 allreduce 判断数据切分是否对齐的阈值使用每聚合域设备数 deviceNumPerAggregation_，而切分应按参与通信的总 rank 数 userRankSize_ 对齐，特定规模下切分对齐判断错误。修复将阈值判断改
effect:

title: SingleLayerLstmGrad 反向重算前向门值舍入分叉
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SingleLayerLstmGrad 反向重算
  behavior: 950 系列 regbase 小形状与大形状 wide 路径下，FP16/BF16 反向此前在 kernel 内用 x/w/init_h/init_c/b 重算 FP32 门值与状态再递推，与调用方保存的前向状态存在舍入差异。
effect:
  objects:
  - 梯度
  detail: FP16/BF16 反向 dw/db 参数梯度超精度限值：仓内注释实测 T=64 B=2 I=128 H=128 bfloat16 下 dw mare=11.4、db=14.9（限值 2.0，FP32 通过），无报错，带偏梯度进优化器。
  visibility: 静默错误
mitigation:
  detect: bf16 LSTM 反向 dw/db 与「消费保存前向状态」的参考实现对账；固定形状 bf16 用例做 mare 看护
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14259（open）：移除 kernel 内前向重算、改为消费调用方保存状态并在公共 dtype 边界显式舍入，FP32 加跨块舍入残差补偿；未发布
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-12'
remarks: 精度证据来自仓内代码注释记录的历史实测；机制与 ACT 类『重算与前向分叉→静默错梯度』同构，但发生在算子 kernel 内部、成因为舍入而非 RNG/路由状态，不挂 var。

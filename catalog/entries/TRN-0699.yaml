title: Conv3DV2 出参通道数不符被接受越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Conv3DV2 CheckOutputShape
  behavior: CheckOutputShape 只校验输出 D/H/W 限值，不比 y.C 与 filter.N；tiling 按 oriWeightN 推 co 而输出描述符保留调用方通道维
effect:
  objects:
  - 数值结果
  detail: y.C<filter.N 时输出缓冲不足被 kernel 按 filter.N 通道写出界；偏大时 shape/语义错配；均无报错
  visibility: 静默错误
mitigation:
  detect: 下发前对账 y.C==filter.N；host UT 回归 check_output_shape_channel_mismatch_fail
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14004 （open 2026-11-09）：CheckOutputShape 拒绝 oriOutputC != oriWeightN，回归 37/37 通过（confirmed_bug）

id: TRN-0743
legacy_ids: []
slug: swift_streaming_resume_replays_consumed
aliases: []
title: ms-swift streaming resume 从头重放已训样本
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: ms-swift
    component: _prepare_dataloader
  behavior: streaming 分支在 build_streaming_dataloader 后直接 return，不带任何 resume 信息；skip_batches 快进基础设施已存在但不可达，构造 dispatcher 时未传入。
effect:
  objects:
  - 训练样本流
  detail: 断点续训把流从位置 0 重启，静默重训上次 ckpt 以来全部样本：生产实测 1200 步间隔 ~74 分钟数据/rank 被重放，唯一症状是 resume 后 loss 回退。
  visibility: 静默错误
mitigation:
  detect: resume 后首个 batch 与 ckpt 时消费位置对账；监控 resume 后 loss 是否出现回退跳变
  fix: 修复 PR https://github.com/modelscope/ms-swift/pull/10520（open）：streaming 路径接 skip_batches 快进
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-12'
remarks: '与 DeepSpeed #8405/TRN-0239 族（采样流 RNG 恢复错）同效不同因：本条是流位置不快进而整段重放，流式数据无法事后 seek 核对。'

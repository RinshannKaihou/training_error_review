original:
  mechanism: 'cann/ops-nn issue #8291（2026-11-05 开、2026-11-06 closed）+ 修复 PR #13736：ApplyCamePart1（CAME 优化器第一部分，计算 grad²+eps 的三路归约作为矩估计输入）arch35 路径（Ascend950）存在精度与规划问题：① 直接归约路径在结果写回前未合并归约补偿项，可能丢失低位结果（optim/apply_came_part1/op_host/arch35）；② 长归约、窄列场景多次 FP32 累加舍入误差累积，需分块补偿累加；③ 固定 tile 与后处理缓冲区未按设备 UB 容量及各阶段峰值存活量统一规划。修复（PR #13736，10 文件）：直接归约写回前合并补偿项、长归约/窄列分块补偿累加、UB 动态规划 tile 与缓冲区、CPU golden 全流程 FP64。PR 作者自述已在 Ascend950 完成算子包编译安装、GEIR 图模式三方精度比较三输出 PASS；issue 正文承认未附修复前失败 shape/seed/误差数值，独立复现某条具体失败不可行。CAME 为 confidence-aware Adam 变体，NPU 训练栈实际使用面较 AdamW 窄。'
  source: https://gitcode.com/cann/ops-nn/issues/8291 ；修复 PR：https://gitcode.com/cann/ops-nn/pull/13736
  behavior: 在 Ascend950（arch35）上用 CAME 优化器训练时，ApplyCamePart1 的三路归约输出（grad²+eps 沿不同维的归约）精度超验：直接归约路径丢补偿项导致低位结果丢失，长归约、窄列场景 FP32 多次累加误差累积——优化器矩估计从源头带偏差，训练无任何报错、loss 曲线难察觉，长期训练质量受累积影响；修复后 950 上 GEIR 三方精度全 PASS。
  trigger_surface: CANN ApplyCamePart1 arch35 路径 + 直接归约/长归约/窄列场景；Ascend950 验证，CANN/Python 版本 PR 未提供

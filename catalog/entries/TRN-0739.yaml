  - 训练信号
  detail: 复现：1 个被拒 token（log-ratio +3.0）使序列 IS 均值 0.75（正确 0），pg_loss -0.90（应 -1.00）、pg_clipfrac 1.00（应 0.00）——被拒 token 反转全部幸存 token 的裁剪判定与损失幅度。

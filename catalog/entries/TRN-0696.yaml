original:
  mechanism: 'Ascend/pytorch #5960（2026-11-09 open）+修复 !49099（merged）：Ascend950PR_9579、torch_npu 2.13.0.dev20261105、triton-ascend 3.6.0、Inductor max_autotune(Triton)+epilogue_fusion。现象：输出 dtype 为 fp16/bf16 时生成的 triton_tem_fused_* kernel 缺少 fp32 累加器到输出 dtype 的截断 cast（acc.to(tl.float16)/.to(tl.bfloat16) 再 .to(tl.float32)），epilogue 直接在 fp32 精度下计算并写回，与未融合 epilogue 路径（eager/unfused）数值不一致；mm 与 addmm（bias 加在 epilogue）均命中。根因：torch_npu/_inductor/codegen/scheduling.py 的 NPUTritonScheduling.codegen_template 复刻上游模板 codegen 流程，但漏掉上游 TritonTemplateKernel.codegen_template_body 在 render() 前的 _compute_fusion_metadata(...) 调用（PyTorch 2.12.0 引入，torch/_inductor/select_algorithm.py:1564-1601/1841/1870）；结果 store_output 里 _epilogue_nodes_by_subgraph 不存在、has_epilogue_fusion 恒 False，跳过 acc_dtype != output_dtype 时的两次 to_dtype。修复在 render() 前补调 _compute_fusion_metadata 并把 prologue_nodes 对齐上游参数顺序、显式拒绝 NPU 暂不支持的 prologue 融合（批次快照 2026-11-09T09:54Z merged）。训练面：编译训练的线性层+激活 epilogue 融合与 eager 基线系统性数值偏差。'
  source: https://gitcode.com/Ascend/pytorch/issues/5960
  behavior: NPU 上开 max_autotune(Triton)+epilogue_fusion 编译 (x@x).relu()-1.0 之类的线性层：融合 epilogue 的模板 GEMM 输出与 eager / epilogue_fusion=False 的编译结果数值不一致——fp16/bf16 输出下 epilogue 全程按 fp32 精度计算写回、未按输出 dtype 截断；无报错，两条路径各自都能跑通，只有互相对拍才见差异（atol=1e-2 可过、更严容差失败），训练指标缓慢偏移无信号。
  trigger_surface: Ascend950PR、torch_npu 2.13.0.dev20261105、triton-ascend 3.6.0；Inductor max_autotune_gemm_backends=Triton + epilogue_fusion，fp16/bf16 输出
  discovery: 2026-11-10 每日扫描

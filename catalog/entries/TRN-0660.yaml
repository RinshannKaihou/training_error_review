original:
  mechanism: 'Ascend/op-plugin #691（2026-11-07 open）+ 修复 !6187（open）：NPU 上 bool 张量 torch.add 走算术 aclnn add 内核，整数和直接写入 bool 字节：True+True 底层字节为 2（非零字节），CPU 参考定义 bool 加法为逻辑或（True+True==True）。复现：torch.add([True],[True]).to(torch.int64) NPU 得 2、CPU 得 1；(5,1)+(5,) 广播（OpInfo test_comprehensive___radd___npu_bool 样本 2）25 元素 12 个失配、最大差 1；广播、标量、add_、alpha 各形态均受影响。影响面：所有 eager bool 加法数值正确性（含 __radd__、sum 后处理等下游链路）；OpInfo 测试中编译输出正确、eager 参考侧错误。环境：torch_npu master（op-plugin master 3dbf199a）、CANN 9.2.0-beta.2。修复 PR !6187：bool 张量 add（含广播/CPU 标量/add_/标量重载）路由 aclnnLogicalOr/aclnnInplaceLogicalOr。训练面：数据管线中 bool mask 的算术聚合（mask 求和、计数）在 NPU 上静默错值。推理库 INF-2448 已收同源。'
  source: https://gitcode.com/Ascend/op-plugin/issues/691 ｜修复 PR：https://gitcode.com/Ascend/op-plugin/merge_requests/6187
  behavior: NPU 上对 bool 张量做 torch.add：结果底层字节是算术和（True+True 字节=2）而非逻辑或（1）。直接 print 显示 True（非零字节），但 .to(int64) 得 2（CPU 1）；广播形态 25 元素 12 个失配。add_/alpha/标量全受影响，无任何报错——凡 eager 路径上把 bool mask 做加法聚合（如 token 计数）的结果被静默抬高。
  trigger_surface: torch_npu/op-plugin master + bool 张量 add（eager 全形态）；CANN 9.2.0-beta.2 实测；修复 !6187 open 未合

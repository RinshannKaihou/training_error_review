  detail: 对 requires_grad=True 的非叶张量执行 fill_diagonal_(0) 后反向，对角线位置梯度未置 0，与数学导数及 CPU 不一致；同一注册使 FakeTensor 入图报 ERR01003（fail-fast）。
  visibility: 静默错误
mitigation:
  detect: 对 requires_grad 的非叶方阵 fill_diagonal_(c) 后 sum().backward()，检查对角线梯度应恰为 0，并与 CPU eager 对拍；再用 aot_eager/fullgraph 捕获 FakeTensor 路径

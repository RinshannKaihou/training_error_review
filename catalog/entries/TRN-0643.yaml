title: MoeGatingTopKSoftmax 漏校验末维==k 致越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: CheckOutShape 漏末维==k
  behavior: CheckOutShape 只比维数/dim0/3D 时 dim1，从不比较最后一维==k；yOut 末维小于 k 时第一段放行（ret=0），kernel 按 k 列写越界覆盖调用方 buffer。
effect:

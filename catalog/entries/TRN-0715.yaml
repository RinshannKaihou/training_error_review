title: LightningIndexer 跨基块归并丢等分序致 top-K 选错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: lightning_indexer 归并
  behavior: actS2>512 时 top-K 跨 S2 基块归并，等分（tie）候选间的次序在基块边界处丢失：非等分候选排序正确，等分候选不按索引升序优先取前块，后块 0 分候选顶掉前块等分 golden 索引
effect:
  objects:
  - 数值结果
  detail: actS2>512、K∈{16,32,64}、非 decode 时输出索引与 golden 不一致：无报错、loss 可继续算；23 失败用例 NPU 多出索引共 530,843 个，低于 512 的为 0（均在基块边界之后），非等分行 0 失配；等分候选集中时索引集合正确率可低至 64%。
  visibility: 静默错误

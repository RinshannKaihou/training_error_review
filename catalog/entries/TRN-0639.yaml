id: TRN-0639
legacy_ids: []
slug: pytorch_npu_inductor_argmax_nan_index
aliases: []
title: NPU Inductor argmax/argmin 全 NaN 归约索引错误
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: triton_helpers 极值/索引归约
  behavior: 浮点极值归约未传播 NaN（tl.max/min 无 propagate_nan），索引阶段只按 value==extremum 匹配而 NaN!=NaN 恒假，索引匹配全败后返回填充用最大索引。
effect:
  objects:
  - 数值结果
  detail: 32×32 输入含全 NaN 列时 argmax/argmin 编译结果返回索引 31（eager 为 0），2/32 索引不一致；无报错。训练图出现 NaN 后依赖 argmax/argmin 的路径（异常检测、指标、采样）与 eager 分叉。
  visibility: 静默错误
mitigation:
  detect: 含 NaN 输入的 argmax/argmin 编译 vs eager 对拍（test_argmax_argmin_with_nan_npu 原节点）。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49185（open，未合入）：极值阶段改 arith.maximumf/minimumf 原生 NaN 传播，索引阶段补「输入与极值均为 NaN」匹配并选最低索引；初版上游比较器在 910B 编译路径报 LLVM ERROR 已修订。发布未核实。

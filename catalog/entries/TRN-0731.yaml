original:
  mechanism: 'cann/ops-nn issue #8580（2026-11-11 open，Ascend 950）。aclnnSoftMarginLoss kernel 侧以 Adds(1)+Log 组合实现 log(1+exp(-x*y))：e 极小时 fl(1+e) 舍入为 1，log(1)=0，小值段精度损失明显且 e=inf 行为不正确。实测对照：x=1e-8、y=-1 时 ascend 输出 0.000000，numpy log1p(exp(-x*y)) 参考 1.000000e-08。同 issue 另报 reduction 属性未校验（0/1/2 外取值继续执行产生错误结果）与动态 shape 不支持（infershape/tiling 对未知秩/-1 直接失败，属 fail-loud 边界外）。与 TRN-0604 foreach_log1p 的 Adds(dst,src,1)+Log 别名同机制：本条是损失算子 soft_margin_loss 的实现。来源：https://gitcode.com/cann/ops-nn/issues/8580 。训练面：soft margin/logistic 类损失训练时易样本（-x*y 大、e 极小）贡献被清零，绝对误差 ~e 量级、系统性偏低。'
  source: https://gitcode.com/cann/ops-nn/issues/8580
  behavior: 在 950 上训练用 SoftMarginLoss：当样本被分得很对（-x*y 大、e=exp(-x*y) 极小，训练后期常态）时，该样本的 log(1+e) 项在 NPU 上直接算成 0（正确值≈e，如实测 1e-8 算成 0.000000）；无报错，易样本的损失贡献被静默清零，loss 数值系统性偏低，e=inf 极值行为也不正确。
  trigger_surface: Ascend 950；aclnnSoftMarginLoss reduction=none 小值段与 e=inf；issue open 无修复 PR
  discovery: 2026-11-12 每日扫描

original:
  mechanism: 'torchair #951（open；master 92e1e967）：custom/npu_fusion_attention.py 的前向与反向接口均接收 pse 参数，但 GE 调用分别无条件使用 real_shift=None 与 pse_shift=None，静默丢弃调用者提供的位置偏移；存在于当前允许的 BSH、BNSD 且 keep_prob=1 的两个分支。最小复现：对原 converter 用 mock 的 ge.FlashAttentionScore/FlashAttentionScoreGrad 传入非空 pse sentinel，检查实际图调用关键字——四个非空 PSE 子用例（前/反向×两布局）均收到 None；pse=None 现有行为正常。修复 !3972（open）直接传递原 pse 到两个 GE 输入，不改布局/dropout 支持范围/缩放/输出顺序。反馈仅验证图的输入连线，不声称已取得 NPU 数值或完整模型结果。'
  source: https://gitcode.com/Ascend/torchair/issues/951 ｜ 修复 PR：https://gitcode.com/Ascend/torchair/merge_requests/3972
  behavior: 通过 torchair 的 npu_fusion_attention converter 走 GE 图模式跑 FlashAttention（支持 BSH/BNSD、keep_prob=1），调用时传入 pse（位置偏移，如 ALiBi bias）：构图成功、无任何报错，但偏移被静默丢弃——实际执行的是无偏移的 attention，输出与 eager 带 pse 的结果系统性不符；仅 pse=None 的调用不受影响。
  trigger_surface: torchair master 92e1e967；npu_fusion_attention converter（GE 图模式）+ 非空 pse；BSH/BNSD、keep_prob=1 分支
  discovery: 2026-11-09 每日扫描

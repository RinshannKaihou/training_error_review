original:
  mechanism: 'DeepSpeed issue #9024（2026-11-06 open）：#8928（merged）修复 AutoTP GPTBigCode 多查询梯度归约、#8962（sharding fix）合入后，关 gradient clipping 时 TP 训练与单卡一致；但 K/V 块仍在每个 TP rank 复制，clip 用的全局梯度范数按 rank 重复计数：deepspeed/runtime/utils.py clip_grad_norm_（:462-478）本地算各参数范数后对 tensor-parallel 组 all-reduce 求和——AutoTP 把 fused c_attn weight/bias 标为 tensor_model_parallel，每 rank 的本地范数含自己的 query 行（跨 rank 不相交、求和正确）+完整 K/V 块（跨 rank 重复，求和后多计 TP-1 份）。标准 disjoint DP×TP 布局下 ZeRO-1/2/3 的 DP sum 重建各 TP rank full-shard 范数再 model-parallel all-reduce（stage_1_and_2.py:2706-2719、stage3.py:2464-2481），K/V 重复同样存在；ZeRO-3 的 _grad_norm_counts_every_rank 在分区组跨 TP 时跳过 model-parallel all-reduce（如 zero.Init 下）为另一路径。影响默认 2-norm 分支；inf 分支不受影响。报告者源码定位、机制自洽，未见量化实测数值。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/9024 ；前序：https://github.com/deepspeedai/DeepSpeed/issues/8927 （TRN-0472）
  behavior: DeepSpeed AutoTP（TP>1）训练 GPTBigCode 类 multi-query 模型并开 gradient clipping 时：全局梯度范数把每个 rank 复制的 K/V 行计了 TP 次，范数偏大 → clip 系数被压低 → 整个更新步（含 K/V 行）被过度缩放；训练无报错、loss 正常下降，但有效学习率与预期不符、调参结论失真。关 clip 后（#8928/#8962 已修）梯度本身对齐——只有开 clip 的路径受害。
  trigger_surface: DeepSpeed AutoTP + GPTBigCode multi_query + gradient clipping（默认 2-norm 分支）；标准 DP×TP 布局的 ZeRO-1/2/3 clipping 路径，ZeRO-3 跨 TP 分区组另述；issue 未列硬件/版本
  discovery: 2026-11-07 每日扫描

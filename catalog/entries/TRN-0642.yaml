title: ApplyCamePart1 arch35 归约丢补偿项，CAME 矩静默失精度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: ApplyCamePart1 归约/tiling
  behavior: 直接归约路径结果写回前未合并归约补偿项（丢低位）；长归约/窄列多次 FP32 累加无分块补偿，舍入误差累积；tile 与后处理缓冲区规划未按 UB 容量统一计算。
effect:
  objects:
  - 数值结果
  - 优化器状态
  - 训练轨迹
  detail: Ascend950（arch35）用 CAME 训练时，ApplyCamePart1 的 grad²+eps 三路归约输出精度超验，矩估计带偏差；无报错、loss 曲线难察觉，长期训练质量受累积影响。触发：直接归约/长归约/窄列；issue 未附失败 shape/seed，独立复现具体失败不可行。
  visibility: 静默错误
mitigation:
  detect: 修复前后 FP64 golden 对照（PR 已把 golden 全流程提升 FP64）；长归约窄列 shape 的三输出误差比值检查。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/13736（issue 标注 dd21244 修复提交、950 上 GEIR 三方精度 PASS；issue closed 2026-11-06 快照，未附完整失败数值/seed，发布未核实）。

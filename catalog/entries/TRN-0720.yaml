  behavior: 在 NPU 上用 torch.compile（triton_experimental 后端）跑训练代码时，4 类算子/dtype 组合悄悄算错且不报错：int64 取绝对值大值被截成小值（如 8589934599→7）、布尔加法部分元素翻转、float32 hypot 大输入出 inf/NaN、float64 pow 底数精度掉到 f32；eager 模式全部正确，只有编译后错，对拍才能发现。

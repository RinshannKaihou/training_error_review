title: GeGluGradV2 FP16 中间乘积溢出致梯度失真
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: GeGluGradV2 FP16 路径
  behavior: FP16 路径先用 half 计算 linear*dy 再转 float，中间乘积超 FP16 最大值 65504 即溢出为 ±inf，后续升精度无法恢复；而激活导数小于 1 时最终梯度本可能仍在 FP16 范围内。
effect:
  objects:
  - 梯度
  detail: linear=300、dy=300、gate=-1、approximate=1 时中间乘积 90000 超 65504，golden 返 -inf（正确约 -7468 有限）；注册 144 项中 32 项 FP16 溢出用例失败，修复后全过。
  visibility: 数值异常
mitigation:
  detect: FP16 大激活（linear、dy 数百量级）+ gelu 导数 <1 的边界用例对拍 float64 autograd；kernel UT 检查非有限 FP16 输出。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13576（open）：复用已有 FP32 临时缓冲、乘法前分别转换两个输入；不增 UB、不改公开接口。设备端编译/UT/精度以 CI 为准，未发布。

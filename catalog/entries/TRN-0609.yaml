original:
  mechanism: 'DeepSpeed #8990（2026-11-03 open）+ 修复 PR !8995（open）。ZeRO-3 zero_quantized_nontrainable_weights（冻结权重 int8 存储，LoRA+ZeRO-3 场景）三个设备无关缺陷（CUDA/NPU 同发，平台无关 Python 代码）：1) 初始化量化是死代码且存储被截断为零——quantizer 跑在未初始化 buffer 上（scale 来自垃圾值），结果随后被真实权重的 dtype-cast 拷贝覆写，(-1,1) 内的值在 int8 存储里截断为 0，冻结权重全零、前向输出零、loss 停在 mean(label**2)、零梯度，完全静默；2) 单 rank 拉取 AttributeError：NoGatherHandle/NoGatherCoalescedHandle 读 Init.quantizer_module，但该属性只挂在 Init 实例上；3) 量化合并桶 mishandle：AllGatherCoalescedHandle.wait 把反量化 fp16 输出 cast 回 param.ds_tensor.dtype(int8)，flat 桶反量化假设统一 group size，各 param 存储 group count 不同时算错 elems_per_group（CUDA 静默错值、NPU 整除断言）。复现：LoRA 式模型（冻结 base 层 + 可训 head）+ config 开启该 flag。修复 !8995（open）：真实权重拷入后再量化分区、quantizer 挂 Init 类、合并桶内各 param 用自身 scale 反量化后统一重量化、CPU offload 与该 flag 组合在 init 时拒绝。与 11-03 收录的 TRN-0598（hysteresis=0 scaler 永不降 scale）/TRN-0595/TRN-0599/TRN-0603 同为 DeepSpeed 数值静默族但对象不同（本条冻结权重存储路径）。'
  source: GitHub issue：https://github.com/deepspeedai/DeepSpeed/issues/8990 ；修复 PR：https://github.com/deepspeedai/DeepSpeed/pull/8995 （open）
  behavior: LoRA 微调 + ZeRO-3 并开启 zero_quantized_nontrainable_weights 时，基座冻结权重被存成全零 int8：训练不报任何错，但模型输出恒为零、loss 从第一步起就停在 label 均方水平不动、所有梯度为零；用户看到的是『训练完全没学到东西但流程全绿』。单 rank 拉取冻结权重则直接 AttributeError 崩溃；多 rank 合并桶路径权重数值静默错。
  trigger_surface: DeepSpeed ZeRO-3 + zero_quantized_nontrainable_weights=True + 冻结权重（LoRA 典型）；#8995 另拒绝 CPU offload 组合
  discovery: 2026-11-04 每日扫描

title: trl rollout/trainer logprob 口径不对称 IS 偏置族
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: 采样变换/候选集口径
  behavior: rollout 引擎返回的 logprob 含采样变换（重复惩罚、语法 mask 后重归一化）或只在受限候选集上定义，trainer 用原始 logits 全词表重算——同 token 两套口径直接取比值
effect:
  objects:
  - 训练信号
  detail: 'IS ratio 系统性偏置：GRPO #7914 ratio~1e-28 梯度归零；structured outputs ratio~1e-17 停止学习；AsyncGRPO repetition_penalty!=1 持续偏置；logprob 差最大 5.5~8.9 nats'
  visibility: 静默错误
mitigation:
  detect: 对账 rollout 返回 logprob 与 trainer 重算值（逐 token 差）；watch grad_norm 无故趋零且 frac_reward_zero_std 正常
  fix: 已出修复：#7915 加警告（GRPO）；#8139 删 AsyncGRPO repetition_penalty 配置项（open）；#8145 structured outputs 要求 top_k>0 走候选集重归一化（open，logprob 差 5.5/8.9→<0.03 nats、ratio 回 ~1）；#7866 候选集重归一化机制

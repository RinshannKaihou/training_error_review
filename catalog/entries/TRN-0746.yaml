original:
  mechanism: CANN ops-nn aclnnForeachDivListInplace（算子 ForeachDivListInplace，arch35/dav-3510 regbase kernel）在 op_kernel/arch35/foreach_div_list_inplace_regbase.h 里把除法精度档常量 DIV_PRECISE 设为 {DivAlgo::PRECISION_0ULP_FTZ_TRUE}。该档位满足 0 ULP 正确舍入，但按 FTZ 语义把 fp32 非规格数（|x| < FLT_MIN=1.17549435e-38）操作数冲零：非规格数出现在除数 x2 位置时执行退化为 x/0，商被算成 ±Inf，而真商仍可能落在 float32 可表示范围内（issue 例子 1e-4/1e-40≈1e36；kernel 注释例子约 2.5e38）。影响范围为 ascend950、ascend350 两个 AICore 配置（foreach_div_list_inplace_def.cpp 的 AddConfig），dtype 注册 FLOAT32/FLOAT16/BFLOAT16——half/bfloat16 先 Cast 到 float 再走同一 DIV_PRECISE，故一并受影响；in-place 语义不变（x1 既是输入又是输出）。定位依据是 issue 引用的 TTK cross_check 用例（NPU 侧 ±Inf、golden 侧有限值判 NaN/Inf mismatch）与 kernel 常量语义，提交时未附真机日志。修复 PR !14143（已 merged 2026-11-12）把常量改为 DivAlgo::PRECISION_0ULP_FTZ_FALSE，改用完整 IEEE 754 语义，只改 kernel 常量与注释、不动 host/tiling、op_graph、接口签名与文档；代价是单次除法开销上升（issue 记录原注释实测 FTZ_TRUE 218.7us vs FTZ_FALSE 2028.1us，约 9.3x）。
  source: https://gitcode.com/cann/ops-nn/issues/8650 ｜修复 https://gitcode.com/cann/ops-nn/merge_requests/14143
  behavior: NPU 训练里用 _foreach_div_ 做逐参数缩放/优化器更新时，只要某个参数的除数元素落进 fp32 非规格数区间（如 1e-40），算子返回成功但对应商直接变成 ±Inf；本应得到的 1e36 级有限值丢失，Inf 随后污染权重与 loss，且无任何错误码或告警，只有做 isfinite 检查或与 CPU 对拍才发现。950/350 的 arch35 路径必现，910B 等非 arch35 平台不受影响。
  trigger_surface: aclnnForeachDivListInplace，ascend950/ascend350（arch35/dav-3510）regbase kernel；fp32/fp16/bf16；除数含 fp32 非规格数；CANN 版本未在 issue 中固定（ops-nn 9.2.0 代码）+ Arch35。
  discovery: 2026-11-13 每日扫描
  notes: []

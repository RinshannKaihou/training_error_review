  visibility: 静默错误
mitigation:
  detect: 小值段（-x*y 极小）与 e=inf 用例和 numpy log1p 参考对账；reduction=none 逐元素比较
  fix: 待定（issue open，未见修复 PR；期望 kernel 侧改 log1p 语义：e 极小返回精确 log1p(e)、e=inf 返回 inf）

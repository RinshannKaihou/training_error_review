  - subsystem: 算子/内核
    stack: cann
    component: InplaceApplyAddSign 求值序
  behavior: m_out 未按 beta 域自适应选择结合序，大幅值合法输入下出现灾难性消光点与 Inf+(-Inf)=NaN 精度失真；同批加固含非连续存储静默错映射等 P1。
effect:
  objects:
  - 优化器状态
  detail: 大动态范围合法输入的 AddSign 更新中动量 m_out 精度失真或产出 NaN，无报错写入优化器状态并传到后续步；TF golden 三方对账 272 例覆盖。
  visibility: 数值异常
mitigation:
  detect: 大幅值合法输入（含 +Inf/-Inf 混合）与 TensorFlow 参考逐元素对账 m_out/update；beta 域边界用例
  fix: '修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14267（open，Closes #8648）：m_out 按 beta 域自适应选择结合序消除消光点；附 tiling 健壮性、Host 校验、AutoContiguous、UT/golden 资产；未发布'

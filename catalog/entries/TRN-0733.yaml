original:
  mechanism: 'cann/ops-nn 修复 PR !14267（2026-11-11 open，Closes #8648）对 InplaceApplyAddSign 的质量加固。核心数值缺陷：kernel 内 m_out 的计算结合序固定，不按 beta 域自适应，大幅值合法输入下存在灾难性消光点与 Inf+(-Inf)=NaN 精度失真；修复改为按 beta 域自适应选择结合序。关联 issue #8648（2026-11-11 open）的修复项表另列 P1：OpDef 全部 7 输入+2 输出未声明 AutoContiguous() 而 tiling/kernel 按一维平坦连续布局消费，非连续存储静默错误元素映射；tiling 入口无逐维非负/已具体化校验，storage shape 含 -1/-2 时 GetShapeSize 乘积为负经 uint32 窄化回绕仍 GRAPH_SUCCESS 放行垃圾 tiling；coreNum/ubSize 零值查询不拦截；UINT32_MAX 守卫位于规模算术之后（拒绝路径先历有符号溢出 UB）；blockFormer 边界窄化溢出误放。验证：Host UT 89/89、kernel 看护集 91/91、与 TensorFlow 参考三方对账 272 case 通过。来源：https://gitcode.com/cann/ops-nn/merge_requests/14267 、https://gitcode.com/cann/ops-nn/issues/8648 。训练面：AddSign 系优化器更新算子，错值/NaN 静默进入优化器状态。'
  source: https://gitcode.com/cann/ops-nn/merge_requests/14267 ｜关联 issue：https://gitcode.com/cann/ops-nn/issues/8648
  behavior: 用 InplaceApplyAddSign（AddSign 系优化器 step）训练时，遇到大动态范围的合法参数/梯度值（含正负 Inf 混合的中间量）会把动量项 m_out 算出精度失真值甚至 NaN，无报错写回优化器状态并在后续步继续传播；传非连续存储的张量时元素映射静默错位。修复前行为由 golden 三方对账与 UT 定位，无用户侧训练任务影响实测。
  trigger_surface: Ascend 950/arch35（def 注册）；大动态范围合法输入、非连续存储输入；修复 !14267 open 未发布
  discovery: 2026-11-12 每日扫描

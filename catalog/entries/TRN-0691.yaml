original:
  mechanism: 'Ascend/pytorch #5961/#5962（2026-11-09 open，均含修复 PR）两条同层缺陷：①eliminate_modular() 对乘法索引用单个轴长的代入结果判断完整表达式，(6*i)%3 被错误化简为 6*i 产生错误 load 地址——社区用例 test_torchinductor.py::test_buffer_use_after_remove_npu 历史失败记录 eager 前向 24、编译 22；修复 !49132（同补丁已入 dev 仓 PTA !90），离线符号检查覆盖 560 表达式/1960 取值无不等价、17 项符号检查+12 组 load 地址检查通过，NPU 整图回归与主仓 CI 待完成。②父子轴替换直接比较范围表达式结构，漏判 s*u+s*z 与 s*floor((s*u+s*z)/s) 的数值等价，repeat 场景 load 已替换为子轴、store 仍用旧父轴，行映射错——test_size_with_unbacked_add_expr_transitive_npu / test_size_with_unbacked_add_and_mul_expr_npu FAIL；修复 !49133（dev 仓 PTA !91），2026-11-05 NPU 源码 A/B 两用例 FAIL→PASS，test_repeat/test_repeat_as_strided 及动态索引/梯度检查通过。与 TRN-0689（detect_flattened_dims 未知符号轴遗留 flatten 候选）同族：主机端索引/符号分析在无法证明等价时不保守保留而错误改写。训练面：torch.compile 训练图内取模索引/repeat 直接错值。'
  source: https://gitcode.com/Ascend/pytorch/issues/5961 ｜ https://gitcode.com/Ascend/pytorch/issues/5962
  behavior: torch_npu 上用 torch.compile 编译含取模索引或 repeat 的模型：编译版本前向输出与 eager 不一致（社区用例 eager 得 24、编译得 22），或 repeat/带符号 shape 的操作后 load/store 行映射错、输出张量内容错位；无报错、无 NaN，数值看似合理，只有与 eager 对拍或下游指标异常时才暴露。同一代码关掉 compile 即恢复正确。
  trigger_surface: torch_npu master/dev（配套 PyTorch 2.13~2.16）inductor 路径；乘法取模索引、repeat 复合符号轴替换

original:
  mechanism: 'Megatron-LM #9114（open PR，2026-11-08）：overlap_moe_expert_parallel_comm 的 1F1B overlap schedule 下，Megatron-FSDP v1 可在临时梯度桶的归约执行前复用其内存，corrupting gradients（wrong losses or NaN）。机制：sharded gradients（optim_grads/optim_grads_params）下每桶未归约梯度进临时桶；桶由第一个梯度 hook 的流（通常默认流）分配，reduce-scatter 在独立流上执行；GradReducePipeline 在后续归约 launch 前让当前流等待先前归约再释放该桶。但 1F1B overlap 让部分梯度 hook（含 MTP 的 mtp.eh_proj 与 decoder.final_layernorm）跑在通信流上——通信流的 hook 可释放默认流分配的桶，而只有通信流等过归约；CUDA caching allocator 立即把内存归还给分配流（默认流），默认流可在归约仍在读时复用。修复：DataParallelBuffer 记录桶分配流；释放前若非当前流则使分配流等待归约 event。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/9114
  behavior: MFSDP v1 + 1F1B overlap（overlap_moe_expert_parallel_comm）+ sharded gradients 训练：梯度临时桶的内存在其 reduce-scatter 还在读时被默认流复用——loss 无故变错或直接 NaN、训练可能崩或静默用坏梯度继续；MTP 场景（mtp.eh_proj/final_layernorm 的 hook 跑在通信流）是明确触发点；无显式报错指向桶生命周期。
  trigger_surface: Megatron-LM MFSDP v1 + overlap_moe_expert_parallel_comm（1F1B overlap schedule）+ optim_grads/optim_grads_params sharded gradients；含 MTP 时触发面更大
  discovery: 2026-11-09 每日扫描

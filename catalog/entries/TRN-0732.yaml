original:
  mechanism: 'cann/ops-nn issue #8581（2026-11-11 open，Ascend 950）。SparseApplyAdadelta kernel 侧 update 计算为 sqrtf(numer)*(g/sqrtf(denom))——先做除法再做乘法；README 公式与 TensorFlow 参考实现为 (sqrt(numer)/sqrt(denom))*g。两者数学等价但浮点不等价：denom 很大（如 1e20）、g 很小（如 1e-20）时，g/sqrt(denom)=1e-20/1e-10 先下溢为 0（fp32 最小正规约 1.2e-38，构造值已越过），update 静默变 0。同 issue 另报 tiling 对 kCount/varShapeSize 无负值与乘法溢出校验（核数计算窄位宽）、infershape 对 var/accum/accum_update/grad/indices 秩与形状一致性无校验，非法输入不返回 GRAPH_FAILED 而是继续执行，存在越界与结果错误风险。来源：https://gitcode.com/cann/ops-nn/issues/8581 。训练面：稀疏 Adadelta 用于嵌入行稀疏更新，长跑后 accum 增大、grad 变小的组合可命中下溢区，更新静默归零。'
  source: https://gitcode.com/cann/ops-nn/issues/8581
  behavior: 用 SparseApplyAdadelta 训练嵌入时，若某行的 accum_update（denom）已很大而梯度很小（长跑后期常见组合），该行 update 的中间商 g/sqrt(denom) 在 fp32 下溢为 0，整步更新静默变 0——不报错、loss 无异常，但这些行的权重从此停止有效更新；构造值（denom=1e20、g=1e-20）已复现该路径，与 TF 参考实现不等价。
  trigger_surface: Ascend 950；SparseApplyAdadelta update 公式，denom 极大 × g 极小组合；issue open 无修复 PR
  discovery: 2026-11-12 每日扫描

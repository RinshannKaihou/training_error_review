  mechanism: ops-nn !14099（2026-11-10，open，纯 op_api 适配层修复，复用原融合 kernel）。4 项缺陷及触发条件来自 PR 表格：负 invstd 丢符号 / eps 参与抵消（2.2% 实测）/ eps 异常全错 / fp16 方差下溢全 NaN；修复为 var=1/invstd² 且 eps 传 0、sign(invstd) 折进 weight、统计量统一 cast fp32；release note 声明行为变化（对齐 torch aten::batch_norm_elemt 的 eps 语义）。
  source: https://gitcode.com/cann/ops-nn/pull/14099
  behavior: 用 BatchNormElemt 按保存统计量做元素级归一化时：invstd 很大（方差极小的通道，fp16 下 std<2.4e-4 真实存在）输出全 NaN；invstd 与 eps 量级接近时输出相对误差可达 2.2%；负 invstd 符号被吞。全部静默发生，fp32 常规输入看似正常，问题集中在极端但真实的窄方差通道与 fp16 统计量场景。

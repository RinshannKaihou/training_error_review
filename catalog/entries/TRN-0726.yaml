cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: AsyncGRPO 前缀缓存
  behavior: pause() 以 keep&clear_cache=false 暂停，vLLM 0.32 权重更新与 resume 均不清前缀缓存：共享前缀一直复用最初权重算出的 KV，max_staleness 不约束
effect:
  objects:
  - 训练信号
  detail: 实测 Qwen3-4B/GSM8K/1397tok system prompt（200 步）：加 cache_salt 后 kl 0.082→0.0010、masked_mean 3.2%→0.014%（reward 基本不变）——KL 与采样掩码被旧前缀 KV 抬高，on-policy 假设被破坏
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（SkyRL/prime-rl 的 cache_salt 方案可借鉴；TRL 侧未见修复 PR）

original:
  mechanism: 'Ascend/pytorch #5938（2026-11-07 open）+ 修复 !49242（open）：G02 社区跟随测试（#190068 前反向区域配置用例）输出数值比较失败，抽离嵌套区域后普通大尺寸 sum 也错，根因在 triton_experimental 分核归约代码生成两处：① 全局 reduction numel 能整除 block，但 ceil(numel/核数) 未必整除 block——load 生成时尚未标记 rsplit，尾块 mask 被当作恒真删除；后续分核改写只替换循环边界，无法恢复已删除的 load mask，造成跨分片重复读取和末片越界（额外分配 65536 sentinel 区域稳定暴露 view 边界外读取）。② 多轴提升生成逐轴循环、常量边界和广播形式 store，现有 partial-body 改写无法匹配，却仍生成 workspace combine，导致输出错误。实测（910B3、CANN 9.1.0、PyTorch 2.15.0.dev、Triton 3.6.0/triton-ascend 3.6.0.post2、master 8fdb4b49b5）：test_scalar_sum_with_guarded_storage 期望 1048576.0 实得 3625399.0（相对差 2.46）、test_outer_sum_with_guarded_storage 4/4 元素错（最大绝对差 448951）。修复 PR !49242：load 代码生成前识别分核候选保留 reduction mask、改写为当前核 hi 边界；partial-body 限定单个未映射归约轴，多轴回落普通归约。修复后 20 测试方法/24 参数化实例全 PASS + 28 项专项回归全 PASS（910B3 实测，与 !49240/!49253/!49254/!49255 五笔组合验证）。关联 #5638 G02 跟随上游 pytorch#188976/#189320/#190068/#191672。与 TRN-0280（常量特化 r-numel 误编译）同属 triton_experimental 归约改写静默错值族，触发点不同（尾块 mask 删除 vs 常量烧入）。推理库 INF-2450 已收同源。'
  source: https://gitcode.com/Ascend/pytorch/issues/5938 ｜修复 PR：https://gitcode.com/Ascend/pytorch/merge_requests/49242
  behavior: NPU 上用 TORCHINDUCTOR_NPU_BACKEND=triton_experimental 对含大尺寸归约（如 x.sum()、x.sum(dim=0)）的函数做 torch.compile：编译结果与 eager 明显不符——实测 1M 元素求和得 3625399（应 1048576，错 3.5 倍）、外轴归约 4/4 元素错；无任何报错或 NaN，只有把编译结果与 eager 对账才能发现。全局规模能整除 block 也会触发（分核后每核尾块不整除即中招）；多轴归约同样错。
  trigger_surface: triton_experimental 后端 torch.compile + split reduction（大尺寸 sum/softmax 后求和等）；numel 整除 block 但 ceil(numel/核数) 不整除 block，或多轴提升归约；Ascend 910B3、CANN 9.1.0、Triton 3.6.0/triton-ascend 3.6.0.post2 实测（master 8fdb4b49b5）

original:
  mechanism: 'NVIDIA/Megatron-LM #9048+#8997（均 closed，2026-11-06/04）：①CP>1 且 calculate_per_token_loss=False 时各 CP rank 用 CP 本地 valid-token 数除 masked loss sum，DDP 再对 DP×CP 平均梯度——实际优化 CP 局部均值之均值而非微批 masked 均值；CP ranks 有效 token 数不同（prompt/padding mask、--eod-mask-loss）时 CP=1 与 CP=2 同数据梯度不同（改变方向非仅尺度）。回归来源：3806ec2754（内部 MR !3139）删掉了此前 GPT/Mamba/多模态 loss 函数对 CP 组的 loss sum/token count all-reduce 及 schedule 的 ×CP。修复：count 对 CP 组求和、loss 乘 CP size，等 count 时梯度数学不变（2 幂 CP 位相同）；仅该模式生效，per-token loss 与两值 loss 函数不受影响。②calculate_per_token_loss 下 process_mtp_loss 把各逻辑微批 MTP loss 按 valid MTP targets 归一、再按 main-loss token count re-weight，梯度 finalize 再除全局 main count——MTP/main 有效比例随微批/DP 划分变化时 token 有效权重依赖划分（packed/masked 序列触发）；#7048 已使其 CP 不变，仍微批相关。修复加 opt-in --mtp-normalize-loss-by-main-tokens：MTP loss 保持为和、与 main 用同一全局分母，无需 CP collective；4×GB200 89 项测试通过。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/9048 ｜ https://github.com/NVIDIA/Megatron-LM/pull/8997
  behavior: CP>1 且各 rank 有效 token 数不同（padding/prompt mask、--eod-mask-loss）训练：换 CP 度（CP=1→2）相同数据得到不同梯度方向，loss 读数也不可比，静默改变训练目标；MTP 场景（packed/masked 序列）MTP token 的有效权重随微批/DP 划分漂移，重新划分数据即改变每个 token 的训练权重。两者均无报错，只有跨划分对拍梯度/loss 才暴露。
  trigger_surface: Megatron-LM；CP>1 + calculate_per_token_loss=False + 各 CP rank 有效 token 数不同；MTP + packed/masked 序列
  discovery: 2026-11-10 每日扫描

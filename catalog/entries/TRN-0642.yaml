remarks: 与 TRN-0564/0637（INTrainingUpdateV2/BN 归约舍入残差族）同「FP 舍入残差丢失」大类但不同算子（CAME 优化器估计矩）——不建 var（归约补偿项合并 vs 减法残差，机制不完全同构）。PR 未附修复前失败数值，独立复现受限，documented。

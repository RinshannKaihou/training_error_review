original:
  mechanism: 'pytorch/torchtitan #5989（open PR，2026-11-09，2xH100 验证）：async_mode="async_with_pinned_mem" 下 DCP 的 DefaultStager 在自有 stream 上把 state 拷到 CPU（后台线程），该 stream 不等当前流；ckpt 频率与 log 频率不对齐时（如 ckpt 每 20 步、log 每 11 步），无 log 的步 train_step 在 optim.step() 后直接返回、无 .item() 类 host 同步，save 开始时优化器步可能仍在 GPU 执行——staged 拷贝在 4/5 试验中持旧值。训练流顺序为 optim.step()→CPU 工作（log）→ckpt staging（copy），只有 log 的 .item() 会让 CPU 等 GPU。修复：async_with_pinned_mem save 前让 staging stream 等待当前流（CPU 不阻塞）；async 模式（当前流 staging）与 torch_checkpointing 后端（stager 已等当前流）不受影响。验证：不修 resume loss 不同、修复后 bitwise 相等；5 次排队试验 4/5 旧值→5/5 新值。'
  source: https://github.com/pytorch/torchtitan/pull/5989
  behavior: torchtitan 开 async_with_pinned_mem 异步 checkpoint、且存盘频率与日志频率不对齐：checkpoint 文件里的权重/优化器状态是 step 前的旧值或新旧混合，保存成功、无任何警告；从该 ckpt resume 后 loss 与原轨迹不重合（bitwise 不同），训练表面继续，只有 resume 对拍才能发现存了旧状态。
  trigger_surface: torchtitan async_mode=async_with_pinned_mem；ckpt 间隔步不触发 log（无 host 同步）时保存
  discovery: 2026-11-10 每日扫描

id: TRN-0619
legacy_ids: []
slug: mindformers_mla_tnd_dsa_mask_loss
aliases: []
title: MindFormers DSA 标志误判致 MLA 丢因果掩码
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 模型定义
    stack: mindformers
    component: MLA 预处理掩码分支
  behavior: 预处理只查 DSA 稀疏标志不看实际 attention variant，普通 MLA+TND+EOD 压缩时提前返回空 attention mask，FA V4 读整段序列而非因果前缀。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 自回归位置应仅访问因果前缀却读到全序列：首 token 与因果前缀参考最大绝对差 0.90191650（与全序列参考仅 3.4e-5），输出与 Q/K/V 梯度均有差异；末 token 不受影响。
  visibility: 静默错误
mitigation:
  detect: 同一随机种子分别传空 mask 与压缩因果 mask 调 local_v4_varlen_flash_attention 对拍因果前缀参考（Q/K [4096,32,192]、384 累积端点）。
  fix: 待定（修复 PR 载体未建；修复方向：把空 mask 分支限制到实际 DSA 稀疏路径，压缩因果 mask 按实际 variant 生成）。

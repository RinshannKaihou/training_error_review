title: TorchAir AddMM 拆分丢 bias 低精度舍入边界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torchair
    component: AddMM lowering 拆分
  behavior: 二维逐元素 bias 的 aten.addmm 被 lowering 拆成 MatMul+Add，bias 生产者 Mul 内联进 FP32 Add epilogue 丢失原 BF16/FP16 输出的舍入边界，融合后逐元素偏离融合前。
effect:
  objects:
  - 数值结果
  detail: BF16 五轮矩阵多项式图首轮 200252/1048576 元素不同、最大绝对差 3.05e-5，五轮更新放大，完整输出 83 判据回归失败；恢复 10 处 bias 舍入即逐位一致。
  visibility: 静默错误
mitigation:
  detect: MM 融合开关 A/B 对拍完整网络输出（uint8 逐字节）；保留片段级真实中间输入回放。
  fix: 修复 PR https://gitcode.com/Ascend/torchair/merge_requests/3950（open 2026-11-04，26.2.0 分支）：保留原生 bias 语义、非向量 bias 整体回退原生算子；另修 CV 共享输入 storage 别名漏保护。未发布。

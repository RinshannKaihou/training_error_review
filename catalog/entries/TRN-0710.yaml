id: TRN-0710
legacy_ids: []
slug: megatron_padded_vocab_below_tokenizer_silent_zero
aliases: []
title: padded-vocab 低于 tokenizer 静默零嵌入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: megatron-lm
    component: vocab 填充校验
  behavior: 显式 padded_vocab_size 不与 tokenizer.vocab_size 比对；TP>1 时各 rank 切片外 id 被 mask 为零嵌入，CE 又把这些位置 mask 出 label
effect:
  objects:
  - 输入编码
  - 训练样本流
  detail: TP>1 时超出 padded vocab 的 token 静默变零嵌入且不进 loss，训练无错误继续；TP=1 首 forward 设备 assert
  visibility: 静默错误
mitigation:
  detect: 启动后断言 padded_vocab_size >= tokenizer.vocab_size；抽查高频 token 嵌入非零率
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/9209 （closed 2026-11-09，"Reject a padded vocabulary smaller than the tokenizer's"；合入未核实）

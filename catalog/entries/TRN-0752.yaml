title: torch_npu put_ 负索引静默不写致 take 梯度全零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: aclnnInplacePut 负索引回绕
  behavior: aclnnInplacePut 不回绕负索引：遇到负索引既不写也不报错返回成功；torch.take 的导数正是 zeros_like(self).put_(index, grad, accumulate=True)
effect:
  objects:
  - 梯度
  detail: put_ 负索引后 NPU 存储全 0（CPU 为 [1,0,0,0,1,0,0,0,1]），take 负索引反向梯度恒 0、无告警；同一 issue 的编译路径则报 507035
  visibility: 静默错误
mitigation:
  detect: 对负索引张量做 put_/take 后与 CPU 或 eager 结果比对梯度；检查是否有非零梯度落在预期位置
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49519 （open，只修编译路径根因一：index_select 重写前回绕负索引）；eager put_ 根因二未见修复 MR

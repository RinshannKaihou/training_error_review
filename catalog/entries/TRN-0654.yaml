title: pad-lane 格缺除法族传播反向梯度 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: pad-lane 抽象格
  behavior: _pad_transform 未覆盖除法族：truediv 落默认规则「全操作数 finite→结果 finite」，掩码外 lane 以 0.0 填充、1/0=inf 被误判 finite，累加器守卫被错删，0*inf=NaN 入累加器。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 同进程序列下 (5,)÷rank-0 样本反向对 rank-0 除子的标量梯度为 NaN；单样本单独运行通过、跨进程复现率约 50%（autotune 决定），状态依赖不稳定失败。
  visibility: 数值异常
mitigation:
  detect: 同批样本逐样本重放 + 对除子梯度 NaN 断言；R0_BLOCK 候选固定复现（R0_BLOCK=1 正确、2/4/8/16/32 全 NaN 可实证）。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49252（open 2026-11-07）：lattice 补除法族（truediv 非精确/倒数等一律 _PAD_TOP，fill 求解器可为除子选 other=-inf）；修复后完整方法冷/热混合多轮全过、无回归（910B3/CANN 9.1.0 实测）。未发布。

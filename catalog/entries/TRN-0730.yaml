title: CE loss ignoreIndex 截断误吞合法 target
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 损失计算
    stack: cann
    component: cross_entropy_loss 路径
  behavior: arch35 FullLoad 与 BigC 路径把 ignoreIndex 按 int32 截断后与 target 比较，超 int32 范围的合法配置值回绕撞上真实类索引。
effect:
  objects:
  - 训练信号
  detail: 大词表/字节级词表场景 ignoreIndex 取超 int32 值时被截断，被截断值恰为某真实类索引的话该类全部样本被静默当作 ignore 从 loss 与梯度中剔除。
  visibility: 静默错误
mitigation:
  detect: ignoreIndex 配置超 int32 的用例做 loss 与逐类梯度贡献对账；FullLoad/BigC + int32/int64 target 回归
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14223（open）：FullLoad 对 int64 target 用 64 位比较、int32 加超范围保护并在 Gather 前屏蔽；BigC 用 int64 保存 ignoreIndex；新增回归用例，未执行上板 ST；未发布
labels:
  stage:

  detail: GA 增大时在重叠 DDP 同步下发布不完整梯度（可多次 RS、DDP 梯度错），GA 减小时归约延迟到 finalization——RL+GTP 训练梯度静默错或同步退化。
  visibility: 静默错误
mitigation:
  detect: 外部改 GA 的回归（2→4 带重叠 DDP）比对梯度与逐份累积参考；GTP+RL 下监控每步 RS 次数
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/9349（open）：改为在当前累积窗口内正向计数，非流水 schedule 自动在最后一次 backward 前调 finish_gtp_wgrad_forward() 保早归约与重叠；含外部改 GA（2→4）回归测试

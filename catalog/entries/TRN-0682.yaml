title: MFSDPv1 梯度桶在归约完成前被释放复用
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: megatron-lm
    component: GradReducePipeline 桶生命周期
  behavior: 1F1B overlap 下部分梯度 hook 跑在通信流上释放了默认流分配的桶；caching allocator 立即向分配流归还内存，默认流可在归约仍在读时复用
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: 临时桶内存被提前复用导致梯度损坏——wrong losses 或 NaN
  visibility: 数值异常

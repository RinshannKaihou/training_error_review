original:
  mechanism: 'triton-ascend #3076（2026-11-10，open，910B4 / CANN 9.2.0 / torch_npu 2.16.0 / triton-ascend 3.6.0）。探针与上游测试同款机制逐样本 diff 实证 4 机制各异且都在编译腿复现（abs/add/pow 在 GENERATE_LIST 注册面，hypot 不在名单但实测仍进编译器）。训练面：triton_experimental 是 torch.compile 在 NPU 的编译后端，训练图中的整型索引/哈希（abs int64）、布尔掩码运算（add bool）、数值稳定敏感算子（hypot/pow）命中即静默错值；推理库同 URL 已收 INF-2489，本条按训练范围单独收录并建 cross。'

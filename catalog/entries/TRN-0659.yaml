original:
  mechanism: '2026-11-07 新开三单，与 TRN-0275（aclnn 空输入早退不写非空出参）同机理，均 910B2（Atlas A2）真机实测并给出 master 源码行定位与修复建议：① ops-nn #8374 aclnnGroupNormBackward：N=0（gradOut/input 空、gamma [C] 非空）两段返回 0、workspaceSize=0，gradGammaOut/gradBetaOut 预填 123456 原样残留；源码 aclnn_group_norm_backward.cpp:691-696 非 Regbase 早退分支只置 workspaceSize=0 返回（同文件 Regbase 分支 :711-719 会走 ComputeGroupNormBackwardEmptyInput 拷回 dgamma/dbeta——A5 正确、A2 缺陷）；N=0 数学上应写 0（空集求和）；复核基线 d1efef7c30 问题仍在。训练影响：动态 batch 退化为 0 时返回成功但输出未初始化显存，随后参与 weight/bias 梯度更新——静默参数污染。② ops-nn #8385 aclnnFusedLinearCrossEntropyLossGrad：BT=0（input [0,H]、grad [0] 均属资料「支持空tensor」）两段返回 0，weightGradOut [V,H]=[128,8] 预填 fp16 canary 0/2048 字节被改写；源码 :298-302 早退无任何写回；BT=0 是空集求和应写全 0；影响：全 mask 空 micro-batch 时 weightGrad 为未初始化显存直接送优化器、垃圾值（含 NaN/Inf 位模式）写进权重，后续 step 才表现为 loss 异常。③ ops-math #4617 aclnnTriangularSolve：self=(3,0)（0 个右端项、A=(3,3) 非空）两段返回 0，mOut 预填 7.0 读回 0/9 元素改写；源码 :184-189 早退只置 workspaceSize=0；非空路径 :204-214 ViewCopy(aBroadcast,mOut) 只依赖 A 与 self 无关，mOut 应为 A 完整拷贝（资料 docs:150 明写）；修复 PR !7205（open）在早退分支补拷 mOut。三单均 open（2026-11-07/08）。'
  source: https://gitcode.com/cann/ops-nn/issues/8374 ；同族：https://gitcode.com/cann/ops-nn/issues/8385 、https://gitcode.com/cann/ops-math/issues/4617 ；TriangularSolve 修复：https://gitcode.com/cann/ops-math/merge_requests/7205
  behavior: NPU（Atlas A2/910B2）上以空 batch/空右端项调用这批 aclnn 反向算子时：接口两段均返回成功、无任何报错，但本应写入的输出（GroupNorm 反向 gradGamma/gradBeta、FusedLinear CE 反向 weightGrad、TriangularSolve 的 mOut）保持调用方缓冲区残留值（预填哨兵 123456/1.0/7.0 实测原样）。动态 shape 训练在空 batch 步（尾批/过滤后空批/全 mask）走反向时，梯度读到未初始化显存并直接参与参数更新，静默污染权重且随显存复用不可复现；非空批恢复正常，问题间歇出现。

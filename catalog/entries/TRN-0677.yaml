title: aclnnIndexAdd 出参版原地改写输入 self
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnIndexAdd 连续分支
  behavior: self 连续时把结果原地写回输入张量再拷到 out；非连续时先 Contiguous 拷副本、改写落在副本上（连续改、非连续不改，证明是实现分支而非接口设计）
effect:
  objects:
  - 数值结果
  detail: 调用后 self 的 device 缓冲区字节被改写（资料声明 self 为输入）；out 数值正确，输入侧污染对重复使用 self 的程序静默传播
  visibility: 静默错误
mitigation:
  detect: 同一块 device 缓冲区调用前后做原始字节比较（与 stride 布局无关）
  fix: 待定（未见修复 PR）

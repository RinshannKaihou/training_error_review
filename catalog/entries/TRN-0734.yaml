  - 梯度
  detail: QAT 低比特量化 clamp 的梯度按错误公式静默计算；旧算子包实测单元素 0.25*(2^127+2^127) 错误输出 Inf（应为有限 2^126），NaN/Inf 传播语义未定义。
  visibility: 静默错误
mitigation:
  detect: clamp 梯度与修正后动态公式的三方参考（torch/TF）对账；单元素大值哨兵用例（0.25*(2^127+2^127) 应有限）
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14168（open，CANNBot）：统一动态公式、TwoSum/FMA 高低位补偿、加数减半梯度加倍二次幂缩放保有限结果、跨核归约部分和；GPU 三方 4/4、NPU 22 项定向回归通过；未发布

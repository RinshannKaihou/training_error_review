original:
  mechanism: 'Ascend/pytorch #5951（open；master ac0e1564）：make_graphed_callables 的 autograd bridge backward 返回 b.detach()，与 capture 的静态梯度缓冲共享存储；外部 Autograd 可能直接保留这块存储作为叶子的 .grad。下一次 graph replay 覆盖静态缓冲时，前一微批累计的梯度或调用者保存的输入梯度也被覆盖。最小例 f(x,w)=x*w 四微批 x=1,2,3,4 期望 w.grad=10，原 bridge 的 CPU replay 用例得 8；另一用例保留第一次输入的 grad，第二次 replay 后其值被改变；连续两次 AdamW 的累计梯度与 eager 不同。修复 !49262（open）：非 None 梯度复制到独立存储（b.detach().clone()），保留 None/原参数对象/前向输出及 replay 流程；随 PR 的三个 CPU bridge 回归补丁前全败、补丁后全过；另提供 RUN_NPU_GRAPH_TESTS=1 的真实 NPU capture 四微批/两次 AdamW 集成用例（本次未运行）。验证方式为 CPU PyTorch 2.11.0 replay 替身，非真实 NPU capture。'
  source: https://gitcode.com/Ascend/pytorch/issues/5951 ｜ 修复 PR：https://gitcode.com/Ascend/pytorch/merge_requests/49262
  behavior: 用 make_graphed_callables 做 NPU graph capture 后多微批训练/梯度累积：期望 w.grad=10（1+2+3+4）实测 8——前一微批的梯度在下次 replay 时被静态缓冲覆盖而丢失；自己保存下来的某次输入梯度张量，在下一次 replay 后数值被改掉；连续两次 optimizer.step 的结果与 eager 不一致；全程无报错无 NaN，只有对账才能发现。
  trigger_surface: Ascend/pytorch master ac0e1564；make_graphed_callables + 多微批梯度累积/外部保留 .grad；CPU replay 替身验证（真实 NPU capture 集成用例待上游设备验证）

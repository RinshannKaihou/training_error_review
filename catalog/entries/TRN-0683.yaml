remarks: 与 TRN-0472（AutoTP multi-query K/V 梯度不归约漂移）同一受体不同缺陷：那边梯度本身漏归约、这边梯度对但 clip 参考范数重复计数；与 TRN-0113 同为 clip 几何假设被复制/分片语义打破

original:
  mechanism: 'ops-transformer #7324（2026-11-10，open，910B3 / CANN 9.1.0）。aclnnLightningIndexer：S2_BASE_SIZE=512，actS2>512 时逐行 SortAll+MergeSort 跨基块归并，等分候选间 (分数降序, 同分索引升序) 的 golden 契约（官方 golden lightning_indexer_golden.py 用 [-score,index] 字典序 stable sort）在跨块归并处丢失。张量级统计：23 失败用例 NPU 多出索引共 530,843 个、低于 512 的为 0（全部落在基块边界之后），被顶掉的 golden 索引集中首块前部；非等分行 0 失配。修复 PR !15685（open，WIP）。'
  source: https://gitcode.com/cann/ops-transformer/issues/7324
  behavior: 训练/调用方在每 batch 有效 key 长度超过 512（跨多个 S2 基块）、sparseCount K 为 16/32/64 且非 decode 场景下，LightningIndexer 的 top-K 稀疏索引输出悄悄选错：无报错、loss 可继续算，但选出的注意力候选集合与参考实现不一致——等分候选集中时（负权重使 relu 钳零、约半数候选 0 分）索引集合正确率可低至 64%。
  discovery: 2026-11-11 每日扫描

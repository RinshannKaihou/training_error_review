id: TRN-0628
legacy_ids: []
slug: msprobe_nan_check_backward_direction_swap
aliases: []
title: msprobe nan_check 反向方向搞反漏存误存
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: msprobe
    component: nan_check backward hook
  behavior: API backward hook 交换两侧梯度后内部 output 才是反向计算梯度，isnan 保存逻辑误用内部 input 作条件，判断方向错误。
effect:
  objects:
  - 指标/日志
  - 测试判定
  detail: 反向新产生 NaN 时不保存（漏存：sqrt(0) 零梯度反向 NaN 无 .pt）；传入梯度含 NaN 而反向正常时反而保存（误存）。12 项验证修复前 6 项失败。
  visibility: 静默错误
mitigation:
  detect: sqrt(0) 零梯度反向与 relu(-1) NaN 传入梯度两组金丝雀场景对照 dump 文件存在性。
  fix: 修复 PR https://gitcode.com/Ascend/msprobe/pull/1138（open）：按反向计算结果决定保存，补经过真实 backward hook 的回归；179 上 3 场景×2 detail×2 data_mode 12 项修复后全过、85 项 UT 通过。未发布。
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-05'
remarks: 观测工具假信号：漏存让训练期新产生的 NaN 梯度无现场证据，误存把注意力引向错误层。同 B.6（msprobe 反号 Inf 归一化）工具族，但此条有真实训练监控语义且独立 issue 载体，按观测面收录。
evidence:
- url: https://gitcode.com/Ascend/msprobe/issues/669
  kind: gitcode_issue

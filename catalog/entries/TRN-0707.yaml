id: TRN-0707
legacy_ids: []
slug: torchtitan_async_pinned_staging_before_optim_step
aliases: []
title: 异步 ckpt 落盘先于优化器步存旧权重
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 权重/检查点
    stack: torchtitan
    component: async ckpt staging 流排序
  behavior: DCP DefaultStager 在自有 stream 从后台线程拷贝、不等待当前流；不 log 的步上 train_step 在 optim.step() 后立即返回无 host 同步，save 开始时优化器步可能仍在执行
effect:
  objects:
  - 模型权重
  - 优化器状态
  detail: ckpt 存进 step 前的权重/优化器状态或新旧混合，保存成功无警告；resume 后 loss 与原轨迹不一致（2xH100 验证，修复后 bitwise 相等）
  visibility: 静默错误
mitigation:
  detect: ckpt 频率与 log 频率错开配置下做 resume 对拍（loss bitwise）；staging 前后对参数做 stream 同步 checksum
  fix: 修复 PR https://github.com/pytorch/torchtitan/pull/5989 （open，2026-11-09）：save 前让 stager 的 staging stream 等待当前流（不阻塞 CPU）；async 模式与 torch_checkpointing 后端不受影响

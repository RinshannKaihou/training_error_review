  mechanism: 'pytorch/torchtitan #5975（open，2026-11-09）：torchtitan/models/deepseek_v4/mhc.py:62-69（c62c6a7）HcSplitSinkhorn.forward 首行归一化用 E/(E.sum(-1,keepdim=True)+eps)，而 DeepSeek V4/V4.1 公开参考 kernel（deepseek-ai/DeepSeek-V4-Flash 与 V4.1-Flash HF 权重库 inference/kernel.py 固定 revision，源码注释 comb.softmax(-1)+eps 并如此实现）为 E/E.sum(-1,keepdim=True)+eps；后续列归一化与其余 19 对行/列归一化一致。E=exp(logits-row_max)。FP64 下前向即不同：ordinary 输入与合成下溢 stress 输入（[[0,-120,-120,-120]]×4）两组的 Sinkhorn 权重及 autograd 梯度均与参考有差（issue 内 CPU 复现脚本）。影响 dsv4 训练与 DeepSeek 参考实现的数值等价性：自身可收敛，但与参考模型/官方权重不可比。'
  source: https://github.com/pytorch/torchtitan/issues/5975

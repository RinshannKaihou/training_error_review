title: verl bf16 top-k tail-KL 梯度方向反转
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: verl
    component: forward_kl_topk_tail 精度
  behavior: use_chunked_topk=True 且 BF16 logits 时，被选 logprob 舍回 BF16 使被选集质量超 1（0.9999→1.0017），student tail 质量为负，tail clamp 删掉梯度甚至反号
effect:
  objects:
  - 梯度
  detail: 梯度方向反转：CPU 对 FP64 参照的梯度余弦 -0.9999976；蒸馏/RL 的 KL 项推向错误方向
  visibility: 静默错误
mitigation:
  detect: BF16 下对 tail-KL 梯度与 FP64 参照比余弦；logits 接近均匀时重点检查
  fix: 修复 PR https://github.com/verl-project/verl/pull/8548（open，未发布）：被选 logprob 保 FP32（chunked helper 可选输出 dtype；非 chunked 路径显式 FP32 log_softmax）

original:
  mechanism: 'cann/ops-transformer issue #7218（2026-11-06 open）：aclnnBlockSparseAttention（V1）在 blockSparseMask 全 0（所有块不参与计算）时两段接口返回 0，但 attentionOut 完全未写。实测（A2/910B2 + CANN 9.3.0 weekly 20261104，ops-transformer master 0e496720）：输出缓冲统一预填 FP16 7.0（0x4700）哨兵，全 1 mask 对照组 16384/16384 正常写入；全 0 mask 组 16384/16384 仍为哨兵 7.0，仅 mask 不同。根因：全 0 mask 时 kernel 侧没有任何可参与计算的 KV 块，当前路径直接跳过该行/块的计算，未调用等价于空行写出的逻辑。报告者关联 #6751（GenericBlockSparseAttention 因果过滤后有效块数为零提前 continue 导致输出未写，已 closed）为同一根因的先例。期望：全 0 mask 时输出仍必须写定义明确的结果（按同族设计应写 0 或中性值），不能返回成功却保留调用方原值。'
  source: https://gitcode.com/cann/ops-transformer/issues/7218 ；同根因先例：https://gitcode.com/cann/ops-transformer/issues/6751 ；V3 版同机制推理条目：INF-1576
  behavior: NPU 上调用 aclnnBlockSparseAttention（V1）且 blockSparseMask 全 0（如某序列所有块被掩掉的稀疏注意力训练/前向）时：接口返回成功，attentionOut 却保持调用方缓冲区原有内容（预填 7.0 实测原样残留）——输出值取决于上一次显存遗留，同样输入两次运行结果可能不同；稀疏注意力训练里被掩序列的注意力输出静默错值并进入反向。
  trigger_surface: aclnnBlockSparseAttention V1 + blockSparseMask 全 0；A2/910B2 + CANN 9.3.0（weekly 20261104）实测，master（2026-11-06）缺陷仍在
  discovery: 2026-11-07 每日扫描

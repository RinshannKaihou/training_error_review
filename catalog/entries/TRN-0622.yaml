  target: INF-2389
original:
  mechanism: 'cann/ops-nn #8102（2026-11-04 open）：aclnnIndexAddV2(self,dim,index,source,alpha,mode,out) 在 index 长度 0（source dim 维同 0，满足资料 shape 约束）时两段接口都返回 0 但 out 一个字节都没写，读回调用方预填哨兵 0xA5/未初始化内存；数学上应等价 out=self（V1 aclnnIndexAdd 同输入行为正确）。真机复现：2026-11-04 NPU2/CANN 9.3.0，dim=0/-1、fp32/fp16、mode=0/1 四组合均可复现（48/48 哨兵字节未变）。源码定位：op_host/op_api/aclnn_index_add_v2.cpp UnDeterministicImpl（约 170-213 行）mode==0 走 l0op::InplaceScatterAddAiCore、mode!=0 走 l0op::InplaceIndexAddAiCpu，两条路径都无『index 空→拷 self 到 out/早退写输出』处理。相关 #8069 覆盖 IndexAdd 族值域/校验问题但不含本条空 index 未写入。报告者按 P0 提交（合法输入+返回成功+输出未写、依赖分配器残留不可复现，反向/优化器链路直接污染梯度或权重更新）。'
  source: https://gitcode.com/cann/ops-nn/issues/8102 ｜相关族：https://gitcode.com/cann/ops-nn/issues/8069
  behavior: 训练/推理代码调 aclnnIndexAddV2 遇到空 index（如空 batch 的梯度散射、过滤后无样本的 embedding 更新）时返回成功，out 却是未初始化脏内存（哨兵实测 48/48 字节未写），结果依赖分配器残留、不可复现；同输入 V1 接口正确。这类脏数据进反向/优化器路径直接污染梯度或权重更新，调用方无任何信号。
  trigger_surface: CANN aclnnIndexAddV2 + index 长度 0（source dim 维同 0，合法）+ 任一 mode/dtype/dim；CANN 9.3.0/Ascend950PR 真机
  discovery: 2026-11-05 每日扫描

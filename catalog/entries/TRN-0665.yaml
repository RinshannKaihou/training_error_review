original:
  mechanism: 'cann/hcomm #1243（2026-11-07 open）：PR #5844（fix sqHead warp，修复后台轮询约 10ms 过慢、RTSQ 消费指针多次回绕后 jetty SQ 溢出检查出错；新增 baseSqHead_ 解回绕追踪、dbSendSlots_ 深度 2x→8x）检视收尾两条 MEDIUM 遗留：① baseSqHead_ 跨线程无原子/屏障保护：数据面线程 RefreshSqHead() 写（rtsq_a5.cc:96-114，写点 :113），后台轮询线程 RtsqPollCompletionDaemon/CollRtsqPollCompletionDaemon 周期调用 PollCompletion→ReadUnwrappedSqHead 读（:117-135，读点 :119）；头文件 rtsq_a5.h:192 仍普通 u32，无 atomic/barrier/锁。ReadUnwrappedSqHead:119 注释要求「先读 baseSqHead_ 再 QuerySqHead」，但源码顺序在 ARMv8 弱内存序下允许 load-load 重排：baseSqHead_ 读到较新值而 hwHead 较旧时 step 算成接近一圈前进、newHead 最多超前 sqDepth-1，PollCompletion 把仍在途的 DbSend 记录判为已完成出队，向 CiTracker 上报未完成的 CI（提前完成/错序）。非原子并发读写本身即 C++ 数据竞争（UB）。同类成员 lastHead_/dbSendHead_/dbSendTail_/sqTailTotal_ 与 dbSendSlots_ 发布/消费同样无同步。作者回复（2026-11-06）：暂时不处理；复检 head de99de1a 确认未修改，第二次独立复核一致。② 环满等待期间 baseSqHead_ 可能无刷新者：RecordDbSendSlot 环满等待循环的 DispatchAllStreams 链路仅 AICPU 构建+本流仍有 pending SQE 时刷新锚点，每批首条 SQE 阻塞时 pendingSqeCnt==0 恒提前退出——等待循环内本流锚点无刷新者；PollCompletion 回退守卫命中直接 return 不自愈；发送侧环满等出队→出队因锚点滞后被守卫跳过→锚点无人推进→空转到 sqFullTimeout 抛 InternalException。作者回复部分成立。训练面：HCCL/hcomm 集合通信（梯度归约/SP 混合并行）完成事件错序上报属静默正确性风险；环满超时为可见挂起。修复建议（release/acquire 或 fence；等待循环内直接 RefreshSqHead；守卫自愈+用例断言）在 issue 中，未见修复 PR。'

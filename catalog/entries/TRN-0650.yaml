id: TRN-0650
legacy_ids: []
slug: arxiv_time_bomb_spike_lm_head_quantization
aliases: []
title: LM head 量化误差累积引发延迟 loss spike
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 优化器
    stack: 通用
    component: LM head 量化误差累积
  behavior: 输出 logit 持续增长使 LM head 权重的量化误差快速累积（降精度加速、升精度减缓），误差累积到临界后触发延迟出现的终局发散。
effect:
  objects:
  - 训练轨迹
  detail: 长时间看似健康训练后（延迟性）突现终局 loss spike（time-bomb spikes）；先兆是 LM head 量化误差快速增长；文献实测把 AdamW 换 SGD-momentum 抑制 logit 增长可提升长期稳定性，且既有 spike 缓解技术共同点都是降低量化误差。
  visibility: 质量退化
mitigation:
  detect: 监控 LM head 权重相对量化误差与输出 logit 范数的联合增长轨迹（先兆信号在 spike 前出现）。
  fix: 论文缓解（非库修复）：LM head 用 SGD with momentum 替代 AdamW 抑制 logit 增长；提高精度/降低量化误差类手段同向有效。
labels:
  stage:
  - pretrain
  confidence: documented
  coverage: NEW
  discovered: '2026-11-07'
remarks: 与 TRN-0015（低精度吸收 slingshot：正确类梯度归零的正反馈）机制不同：本条是 LM head 量化误差累积→延迟终局发散，且给出「既有缓解共享降量化误差机制」的统一解释；与 TRN-0169（weight-norm criticality）亦不同源。文档级证据（论文实证），无单点代码定位。
evidence:
- url: https://arxiv.org/abs/2610.38277
  kind: arxiv
relations: []
original:
  mechanism: arXiv:2610.38277（The Role of Quantization in Loss Spikes，2026-10-28 提交）：语言模型预训练 loss spike 的主要驱动是 LM head 输出 logit 增长与发散；论文研究其中一种高代价形态—— prolonged training 后才出现的延迟终局发散（time-bomb spikes）。实证发现：这类不稳定之前伴随 LM head 量化误差的快速增长，最终以 loss spike 收场；降低数值精度会加速 time-bomb 出现，提高精度则改善稳定性（因果方向经精度干预验证）。缓解：LM head 用 SGD with momentum 替代 AdamW 抑制 logit 增长、改善长期稳定性；并发现文献中既有 spike 缓解技术与本文缓解的共同点是都降低了量化误差——提出有限精度误差是 time-bomb spike 的隐藏驱动机制。与 TRN-0015（吸收误差→正确类梯度归零→Numerical Feature Inflation 正反馈）机制不同：本条定位在 LM head 量化误差累积且为延迟终局形态；与 TRN-0169（归一化引起的 weight-norm criticality）亦不同源。
  source: https://arxiv.org/abs/2610.38277
  behavior: 长程语言模型预训练中，训练前中期 loss 曲线完全健康，但在训练很久之后突然出现终局性 loss spike（time-bomb）导致跑废；可观测先兆是 LM head 的量化误差随输出 logit 增长而快速累积——用更低精度训练会更早引爆、更高精度更稳，LM head 换 SGD-momentum 可抑制。表现为「看似健康的长跑静默退化，某步突发不可逆发散」，此前常规 loss/梯度监控无明显异常。
  trigger_surface: 长程 LM 预训练 + 输出 logit 增长（LM head 权重量化误差累积）；低精度训练加速触发，精度提升减缓
  discovery: 2026-11-07 每日扫描

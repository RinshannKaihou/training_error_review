title: aclgraph 跨流 wait_event 守卫按当前流误判
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: NPUEvent::block 排空守卫
  behavior: hasCapturesUnderway 由设备级非空收窄为按当前流判捕获：wait_event 在 with stream 内调用时守卫 false、不排空队列，WAIT_EVENT 滞留，侧流未 join 捕获。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 侧流后续分配的图私有池过滤条件不命中、回落默认池 (0,0)，replay 出现地址异常服务挂死；同一语义两种写法（wait_event 在 with 内/外）结果不同。
  visibility: 挂起
mitigation:
  detect: 多流捕获用例断言分配落在私有池（GRAPH-POOL 打印 match=1）；wait_event 写在 with 块外做对照。
  fix: 方案在 issue 中给出（门槛改为设备级 num_active_captures_>0 或显式组合「目标流未捕获+设备有捕获」），未见修复 PR（2026-11-07）；规避：wait_event 写在进入 with torch.npu.stream(...) 之前。

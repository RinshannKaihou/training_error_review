    component: aclnnScatterAdd 多对一累加
  behavior: aclnnScatterAdd 在多对一冲突写入（同一目标行被多源并发累加）时偶发丢失或重复计入一次累加贡献，属竞态类缺陷；固定种子输入下偶发（4 数据点 1 失败 3 通过），排除代码回归。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: Embedding per-sample 梯度（expanded weights grad_sample.scatter_add_）偶发整行 15 维偏差：实测最大绝对差 0.0405（容差 1e-4）、相对差 6.04（容差 5e-5），超容差约 400 倍/12 万倍。
  visibility: 不可复现
mitigation:
  detect: 固定种子循环跑 per-sample 梯度对照（batch=1 循环 vs 整 batch）统计失败率；线上可对 embedding 梯度行做和校验
  fix: 待定（issue open 2026-10-27；CI 偶发 1/66519，未定位到算子提交）

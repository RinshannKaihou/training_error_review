original:
  mechanism: 'ms-swift #10506（2026-11-03 open）+ 修复 PR !10507（open）。GLM-5.3-Flash（glm5_next）发布 chat_template.jinja 第 2-3 行每轮渲染 Reasoning Effort 系统行（reasoning_effort 未定义或非 low/high 时默认 max）；ms-swift GLM5NextTemplate（swift/template/templates/glm.py）继承 GLM5_2Template 的 reasoning_effort_needs_thinking=True——仅在开思考时渲染该行，而 glm5_next 思考默认关闭，于是默认参数（及 REASONING_EFFORT=low 但思考关）下每条训练样本编码都缺该系统行，与模型上线/发布模板所见不同。GLM5_3Template（GLM-5.3）已设 False，唯独 glm5_next 漏设。实测（main 680df5c6、v4.6.0，transformers 5.18.0，CPU）：384 行 GSM8K 上 ms-swift 训练模式编码 vs transformers apply_chat_template 发布渲染，修复前 384/384 行 token 不一致，修复后 0 行不一致；配对 28 步 SFT（Megatron-SWIFT）：缺行与带行（--enable_thinking true）两种渲染前三步训练 loss 差约 20%，28 步后收敛（验证 loss 0.356 vs 0.357）。与 TRN-0178（chat_template 训练/上线不一致，SFT.01）同一『训练模板与发布模板静默分叉』机制、不同实例（GLM-5.3-Flash 的 Reasoning Effort 行 vs 通用 generation prompt/工具参数），标 var。'
  source: GitHub issue：https://github.com/modelscope/ms-swift/issues/10506 （open）；修复 PR：https://github.com/modelscope/ms-swift/pull/10507 （open）
  behavior: '用 ms-swift 默认参数微调 GLM-5.3-Flash（glm5_next）时，训练语料的每条样本都缺少模型发布模板里必有的『Reasoning Effort: Max』系统行：训练全程无报错，但前期训练 loss 与正确渲染差约 20%（28 步 SFT 实测），模型学到的是与部署时不同的输入分布；设置 REASONING_EFFORT 环境变量也没用（思考默认关），只有开 --enable_thinking 才带上该行。'
  trigger_surface: ms-swift glm5_next 模板（GLM-5.3-Flash）默认参数 SFT；main 680df5c6 与 v4.6.0
  discovery: 2026-11-04 每日扫描

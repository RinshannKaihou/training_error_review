title: DeepSpeed offload/reload_states 恢复陈旧状态
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: deepspeed
    component: offload/reload_states 重挂
  behavior: offload_states 替换状态张量后视图/链接不重挂，或 reload 从首次 pinned 缓冲恢复：ZeRO-1/2 fragment 指向旧设备副本，ZeRO-3 恢复旧 pinned 值——训练静默接着旧参数跑。
effect:
  objects:
  - 优化器状态
  - 模型权重
  detail: ZERO-1/2：offload(include=[optim_states]) 释放 0 字节、getters 返回 offload 前旧值或抛 TypeError；ZERO-3：pin 变化后 reload 参数回退到上次 offload 值（lr 1e-2 偏差至 1e-2）
  visibility: 静默错误
mitigation:
  detect: offload/reload 循环后对比参数与优化器状态 bit 一致性（修复 PR 附带前后对照）；监控 reload 后首个 step 的 param norm 突变
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/9015 （open 2026-11-04）与 https://github.com/deepspeedai/DeepSpeed/pull/9016 （open 2026-11-04）：#9015 修 ZeRO-3 frozen 参数映射+reload 一致性；#9016 修 ZeRO-1/2 fragment 视图重挂；均未合入未发布

id: TRN-0735
legacy_ids: []
slug: concatv2_infershape_pointer_base_misjudge
aliases: []
title: ConcatV2 InferShape 指针比较误判基底漏加轴维
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: concat_v2 infershape 基底
  behavior: 推导 concat 维大小时以实例指针相等（shapeI==baseShape）识别并跳过基底，运行时同形多输入 desc 同源共享同一 ge::Shape 对象时后续输入被误判为基底跳过求和。
effect:
  objects:
  - 数值结果
  detail: 输出 concat（axis）维尺寸漏加：两输入 {16,4,8} 沿 axis=2 拼接，正确输出 16、实际推导 8——图编译按偏小 shape 推导/分配，无报错。
  visibility: 静默错误
mitigation:
  detect: 同形多输入 ConcatV2 图构图后断言输出 axis 维=各输入之和；对比 eager 路径输出 shape
  fix: 修复 PR https://gitcode.com/cann/ops-math/merge_requests/7301（open WIP）：基底识别改按索引 baseIdx，求和循环按 i==baseIdx 跳过
labels:

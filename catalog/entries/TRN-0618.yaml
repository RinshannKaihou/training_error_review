original:
  mechanism: 'cann/ops-transformer #7101（2026-11-04 open）+ 修复 !15277：FlashAttn 同时启用 learnable sink、滑动窗口/右下角因果 mask 和 LSE 输出时：(1) ClearOutput() 把全部 LSE 初始化为 +inf，不区分有无 sink；(2) GetTaskDealMode 直接跳过无可见 KV 的整块 query，跳过块不进入 ResetSoftmaxBuffer 的 sink 初始化与 LSE 写回；(3) 落在实际执行块内的全 masked 行经 sink 初始化正确保留 sink 贡献——同类行结果依赖分块边界。数学上有限 sink 下全 masked 有效行分母仍有 exp(sink[head])，LSE 应=sink[head]、attention=0。原始 case（FP16 B3H6 S5184 D128，mask_mode=4，win_left=2166/win_right=2996）LSE 匹配率 73.66255%，恰为 2 batch×6 head×2048 行被跳过/93312 元素，逐点检查错误值均为 +inf、golden 为 sink。引入于 sink 功能提交 0063705c58（2026-09-07），arch35（Ascend950PR）真机复现、arch92 存在同路径待验证。对照 Dao-AILab flash-attention CuTe（5f7b05a7）空块处理后仍调 softmax.finalize(sink_val)。修复后原 case LSE 100%、attention 与旧包逐位一致；新增 48 例回归（FP16/BF16、BNSD/BSND/TND、mask 0/3/4）；但 100-case 性能回归存在可复现劣化（作者自述尚不能认为无性能代价）。'
  source: https://gitcode.com/cann/ops-transformer/issues/7101 ｜修复 PR：https://gitcode.com/cann/ops-transformer/merge_requests/15277
  behavior: 训练用 FlashAttention 带 learnable sink、LSE 输出且 mask（滑动窗口/因果）使部分有效 query 的 KV 全被 mask 时，这些行的 LSE 输出为 +inf 而不是 sink 值，且哪些行错取决于分块边界；实测原始 case 26% LSE 元素错（匹配率 73.66%）、attention 输出本身基本不受影响（99.9988% 匹配）——依赖 LSE 的下游（如 normalization/蒸馏目标）静默拿到 inf。
  trigger_surface: CANN flash_attn + learnable sink + return_softmax_lse + mask_mode=4/滑窗使整块 query 全 masked；Ascend950PR arch35 真机复现（CANN 9.3.0），arch92 同路径
  discovery: 2026-11-05 每日扫描

    component: aclnn 空张量早退分支
  behavior: 空输入早退返回 ACLNN_SUCCESS，不生成写非空输出的算子；判空针对特定张量（#7236 只判grad出参、#8389 indices 空且 offsets=[0]/[0,0]）；#7237 CheckShape 首行短路全部约束
effect:
  objects:
  - 数值结果
  detail: 空输入时非空输出（y/indices、probsGradOut、标量 loss、output）保持调用方预填 canary 未写，两段 API 均返回 0
  visibility: 静默错误
mitigation:
  detect: 空输入用例下对非空输出预填 canary 并在调用后读回校验
  fix: 待定（未见修复 PR）

original:
  mechanism: 'DeepSpeed #8991（2026-11-03 open）。ZeRO stage 1/2 + CPU optimizer offload + FP32 master 下，FP32 分区梯度在 step() 后不清零。reset_cpu_buffers() 只清 norm_for_param_grads 与 local_overflow；下一窗口边界仅当参数运行时经 async_inplace_copy_grad_to_fp32_buffer_from_gpu 的 dest_tensor.copy_() 替换其 slice。ignore_unused_parameters 默认 True：缺失参数不进 norm、step 继续，optimizer 对整个 single_partition_of_fp32_groups[i].grad 张量步进——旧 slice 被再次施加，且梯度裁剪已乘整张量，旧 slice 还被本步 clip 系数重缩放。复现步骤（issue 给出）：每参有梯度的 step → 后续某步该参数在窗口内所有 backward 缺席 → 对比零梯度 optimizer 的参数更新，DeepSpeed 施加上一窗口 slice。与 TRN-0595（ds !8981，ZeRO-3 未用参数梯度分区跨步驻留、旧梯度重复施加）同一『未用参数旧梯度驻留被重复施加』机制、不同 stage（1/2 vs 3）与代码路径（CPU offload FP32 buffer vs GPU 分区），标 var。正文并注明清零必须发生在 optimizer 消费当前窗口之后（多个请求边界先于一次 update 时早清会丢累积和，#8949 面）。'
  source: GitHub issue：https://github.com/deepspeedai/DeepSpeed/issues/8991 （open）
  behavior: ZeRO-1/2 + CPU 优化器 offload 训练中，若某可训参数在一个更新窗口内没产生任何梯度（条件分支跳过、该步未用到的模块），下一次 optimizer.step 会把这个参数上一窗口的旧梯度再加到权重上一次（且被当前步的梯度裁剪系数重新缩放）：无报错、无 NaN，权重持续被陈旧更新污染；该参数恢复运行后自动正常，问题只在『间歇性未用参数』上间歇出现。
  trigger_surface: DeepSpeed ZeRO-1/2 + offload_optimizer(CPU) + FP32 master + ignore_unused_parameters=True（默认）+ 参数间歇性无梯度
  discovery: 2026-11-04 每日扫描

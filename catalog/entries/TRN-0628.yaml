  kind: gitcode_pr
relations: []
original:
  mechanism: 'Ascend/msprobe #669（2026-11-04 open）+ 修复 !1138：msProbe eager task=nan_check（默认 check_mode=isnan，L1）的反向 Tensor 保存逻辑方向搞反。API backward hook 会交换两侧梯度（交换后内部 output 才是反向计算得到的梯度），isnan 保存逻辑却使用内部 input 作为条件，判断方向错误；原 UT 直接构造内部梯度、未经过真实 hook 交换所以未发现。后果（detail=false/true 均受影响）：(1) sqrt(0) 传入零梯度、反向得到 NaN 时没有反向 .pt 文件（漏存）——反向新产生的 NaN 无现场证据；(2) relu(-1) 传入 NaN 梯度、反向得到 0 时 data_mode=[''all''] 下保存 2 个反向 .pt（误存）。环境：msProbe d1cd0cd6、Ascend 910B4、CANN 9.1.0、torch-npu 2.10.0.post4。修复：按反向计算结果决定是否保存，补充经过真实 backward hook 的回归用例；179 上 3 反向场景×2 detail×2 data_mode 共 12 项，修复前 6 项失败、修复后全过，相关 85 项 UT 通过。'
  source: https://gitcode.com/Ascend/msprobe/issues/669 ｜修复 PR：https://gitcode.com/Ascend/msprobe/pull/1138
  behavior: 用 msProbe nan_check 监控 NPU 训练时，反向传播新产生的 NaN 梯度不被保存（dump 目录里找不到对应 .pt，NaN 源头无证据），而只是传入梯度带 NaN、反向计算正常的层反而被保存——排查时被引导去看错误的层。detail 开关都一样，训练本身无感知，只有监控结论是错的。修复后 12 项验证全过。
  trigger_surface: msProbe eager nan_check（check_mode=isnan，L1）+ 任意 NPU 训练反向；910B4/CANN 9.1.0/torch-npu 2.10.0.post4
  discovery: 2026-11-05 每日扫描
  notes:
  - 2026-11-06 2026-11-06 回访：修复 MR !1138 批次快照 merged（2026-11-05T01:15Z）；发布版本未核实。

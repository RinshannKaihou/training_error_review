title: aclnn 自动生成接口忽略出参 stride 静默错写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: 自动生成 aclnn 出参回写
  behavior: 无 op_host/op_api 的接口由 op def 自动生成，回写时按连续布局写 storage 前 numel 个元素，出参 stride 不参与寻址，也不在 GetWorkspaceSize 拒绝
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 出参为非连续 view 时：RmsNormGrad dxOut 16/32 为 0，GemmaRmsNorm yOut 30/32 超差，CrossEntropyLoss logProbOut 按 stride{10,2} 读回 20/40 未写、38/40 超差；两段接口均返回成功
  visibility: 静默错误
mitigation:
  detect: 把出参构造成 stride 带空洞的合法 view（max_offset < storage numel），与连续基线逐元素比对并按 stride 读回
  fix: '待定（issue #8663/#8702 等均 open；RmsNorm/RmsNormGrad 文档已把出参非连续列由 √ 改为 ×，但实现仍不拒绝）'

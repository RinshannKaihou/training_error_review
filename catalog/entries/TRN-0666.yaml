    component: SearchSorted dtype 校验
  behavior: 记录 values_dtype_ 但从不与 sequence_dtype_ 比较；Compute 只按 sequence_dtype_ 选实现并 cast values——INT64 配 INT32 时每值按 8 字节读越出缓冲。
effect:

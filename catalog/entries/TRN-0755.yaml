original:
  mechanism: 'CANN ops-nn 中一批算子的 aclnn 接口没有 op_host/op_api 目录、由 op def 自动生成；这些接口在回写结果时按连续布局把 numel(view) 个元素写到 storage 起始处，出参的 stride 完全不参与寻址，也不在 GetWorkspaceSize 返回 161002 拒绝。issue #8663 给出 4 个接口 6 个出参的实测（Atlas A2 910B3 + CANN 9.2.0，A3 + 9.3.0 前 6 项同样失败）：aclnnRmsNorm rstdOut [4,1]/{4,2}/{4,4} 时 3/4 元素为 0；aclnnGemmaRmsNorm yOut [4,8]/{16,2}/{8,16} 时 30/32 超差（worst=3.58）、rstdOut 3/4 为 0；aclnnRmsNormGrad dxOut 16/32 为 0；aclnnAddLayerNormGrad dxOut 16/32、dgammaOut/dbetaOut 4/8 为 0，全部两段返回 0/0。判据对照很干净：同接口入参非连续（x 切片、gamma 切片）全部 PASS，基线全连续全部 PASS；无 op_host/op_api 的 7 个接口 7/7 失败，有手写实现的 Hardswish 与 ForeachMulList 2/2 正常。同族细粒度单：aclnnExpandIntoJaggedPermute #8683（6 个位置错 3 个）、aclnnMaskedSoftmaxWithRelPosBias #8684（64 元素中 32 未写）、aclnnTopKTopPSample #8685（有效值 64 个只剩 32 个）、aclnnCrossEntropyLoss #8702（logProbOut 物理前 40 个全对、按 stride{10,2} 读回 20/40 未写、38/40 超差，@1 got=-2.45191 want=-3.45191，跨 9.2.0/9.3.0 逐位一致）、aclnnForeachDivScalarList/aclnnForeachMulScalarList #8746（两段返回 0/0 且一半未写）。#8663 更新说明指出 RmsNorm/RmsNormGrad 文档已把出参非连续列从 √ 改为 ×（b4db407），这两者属于该拒未拒；GemmaRmsNorm/AddLayerNormGrad 仍是承诺支持却算错。'
  source: https://gitcode.com/cann/ops-nn/issues/8663 ｜https://gitcode.com/cann/ops-nn/issues/8702 ｜https://gitcode.com/cann/ops-nn/issues/8684 ｜https://gitcode.com/cann/ops-nn/issues/8685 ｜https://gitcode.com/cann/ops-nn/issues/8746
  behavior: 训练代码把非连续 view 当出参传给这些算子（典型是往预分配大 buffer 的某个切片/步长视图里写结果），两段接口都返回成功，但结果是按连续布局写到 buffer 开头：按自己的 stride 读回时一半位置还是旧值（0 或预填哨兵），另一半错位。反向算子里表现为部分梯度为 0，参数更新少了一半，loss 却照常下降；只有把同一调用改用连续出参再对拍才能发现。
  trigger_surface: CANN ops-nn 无 op_host/op_api 的自动生成接口（RmsNorm、GemmaRmsNorm、RmsNormGrad、AddLayerNormGrad、CrossEntropyLoss、MaskedSoftmaxWithRelPosBias、TopKTopPSample、ExpandIntoJaggedPermute、Foreach*ScalarList 等）；出参为非连续 view（stride 有空洞但 max_offset < storage numel）；Atlas A2/A3、CANN 9.2.0/9.3.0。
  discovery: 2026-11-13 每日扫描

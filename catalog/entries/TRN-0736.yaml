title: verl 线性注意力 packing 无 FLA 时状态跨样本泄漏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 模型定义
    stack: verl
    component: qwen3_5 packing 分发
  behavior: _call_accepts_kwarg 见 transformers 纯 PyTorch 实现签名带 **kwargs 即判可传 cu_seqlens，传入后被静默吞掉，逐样本切分路径被跳过。
effect:
  objects:
  - 跨请求/跨样本数据
  - 输出分布
  detail: packed 微批被当一个序列，门控 delta 网络循环状态从一样本带入下一样本：单层对照后续样本相对误差 20%~90%+，trainer/rollout logprob 不再一致，训练无告警继续。
  visibility: 静默错误

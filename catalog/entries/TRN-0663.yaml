original:
  mechanism: 'cann/ops-nn #8375（2026-11-07 open，质量加固汇总 issue）+ 修复 !13890（open，Closes #8375）：Celu（activation/celu，Ascend 950/Arch35）两族真机精度缺陷：① T14-01 kernel 负数域 Divs(x,alpha2) 对 fp32 次正规（subnormal）操作数 FTZ——次正规被除数被 flush 输出错零、正规被除数遇次正规除数得过饱和、双次正规得 0/0=NaN，为 8 例真机失败族根因；修复按 alpha2 量级三分支（次正规双边 ×2^23 归一/巨量直除/其余倒数乘），热路径零新增向量指令。② T10-03 负数域 exp(z)-1 在 z∈(-1e-3,0) 近零区两次舍入（exp 舍入后再减 1），相对误差随 z→0 发散——75 条 fp32 精度比对失败根因；修复 Kahan expm1 补偿+z∈[-87,87] 对称夹取防 -inf 经 ln(0) 产生 NaN。验证：kernel 通路全量回归 1071 例（1068 过+3 负向预期拒绝）、75 条 fp32 近零区失败全部修复转绿；真机 495 例（487 过+8 次正规失败族，修复后 8/8 复绿）；次正规组合回归 18/18（覆盖 NaN/错零/过饱和/atol 掩蔽四形态）；golden 与 torch 交叉比对 256 项全过、确定性 50 例×10 轮全过。训练面：Celu 激活的模型在次正规梯度/激活区间静默错值（错零/NaN 形态）。其余项（tiling 负值拦截、错误码、文档、UT 覆盖）为加固配套非本条核心。'
  source: https://gitcode.com/cann/ops-nn/issues/8375 ｜修复 PR：https://gitcode.com/cann/ops-nn/merge_requests/13890
  behavior: NPU（Ascend 950）上训练/推理使用 Celu 激活：当输入或 alpha2 落在 fp32 次正规区间时，负数域输出错零、过饱和或直接 NaN（8 例真机失败族）；当输入落在近零区（z∈(-1e-3,0)）时 exp(z)-1 相对误差随 z→0 发散（75 条 fp32 精度比对失败）。梯度值小到次正规的层最先受害，表现为该层激活/梯度静默错值，无报错；NaN 形态可被下游发现但错零/过饱和形态不可见。
  trigger_surface: CANN ops-nn Cela（Ascend 950/Arch35）+ fp32 次正规操作数或近零 z 输入；950 真机实测；修复 !13890 open 未合

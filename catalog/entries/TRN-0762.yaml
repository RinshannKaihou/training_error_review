original:
  mechanism: 'deepspeedai/DeepSpeed #9087（2026-11-15，open，master 7caa7a2267bc5 / 0.20.1 source，Python 3.12.13 / PyTorch 2.13.0+cu130，CPU FP64，无编译算子）。TiledFusedLogitsLoss 在返回的 loss 被外部归一化/加权时，只把缩放用于 hidden-state 梯度，LM-head 梯度仍按未缩放的分块 sum 累加。最小复现：Linear(4,5,bias=False) double、x=[2,7,4]、labels 含 -100，TiledFusedLogitsLoss.apply(ce_sum, head, x, y, None, 3, params, ''sum'') / n（n=11 个有效 token）：loss error 0.0、hidden grad error 1.04e-17，但 head.weight.grad 范数比 11.0，20/20 元素不匹配。issue 指出 output_reduction=''sum'' + 有效 token 归一化是文档用法；根因在 backward 未接收/应用外部缩放（正文根因段被截断，未见修复 PR）。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/9087
  behavior: 用 TiledFusedLogitsLoss 做分块 LM-head 损失、并对返回 loss 做有效 token 归一化或加权时，loss 数值和 hidden 梯度都对，唯独 lm_head 权重梯度被放大有效 token 数倍（示例 11×，20/20 元素不符）。训练不报错、loss 曲线正常，但 head 更新步长系统性偏大；单卡 CPU FP64 即可复现，只有逐参数对拍参考梯度才能发现。
  trigger_surface: DeepSpeed TiledFusedLogitsLoss，output_reduction='sum' + 外部归一化/加权；CPU FP64 复现。
  discovery: 2026-11-16 每日扫描

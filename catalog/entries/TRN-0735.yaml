  discovered: '2026-11-12'
remarks: '触发前提是运行时同形输入 desc 同源共享 Shape 对象（报告者给的机制条件）；报告者为 cumsum #4574（TRN-0629）同源贡献者，缺陷有代码定位（concat_v2_infershape.cpp 收集/求和两段），共享前提未见真机日志展示。'

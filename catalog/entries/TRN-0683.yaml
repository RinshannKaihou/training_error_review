original:
  mechanism: 'DeepSpeed #9030（open PR，2026-11-07）：tensor-parallel multi-query GPTBigCode 训练 clip 比单卡更激进。融合 attention 投影的 key/value 行在每个 TP rank 都有，范数 all-reduce 把每份都计入——query 行跨 rank 互斥合并成一份，K/V 块每 rank 相同却被加了 TP 次，报告范数偏大、clip 系数偏紧。融合线性层的 weight/bias 标记 model-parallel，每 rank 分片含自身 query 行+完整 K/V 块（backward hook 已归约）。梯度值与单卡一致，错的只是 clip 参考范数，随 K/V 占比与 TP 度增长。修复：融合层在 weight/bias 存复制标记（首复制行/复制行数/TP world size），有限范数累加时按标记只计一次。与 TRN-0472 同受体（GPTBigCode c_attn K/V 复制行）不同缺陷；与 TRN-0113（EP 下平均互不相交专家范数）同为 clip 几何假设失效族。'
  source: https://github.com/deepspeedai/DeepSpeed/pull/9030
  behavior: GPTBigCode 类 multi-query 模型 TP>1 训练开梯度裁剪：梯度值本身与单卡一致，但 clip 参考范数把每 rank 复制的 K/V 行加了 TP 次——clip_coef 被压小、有效更新比单卡弱；TP 度越大、K/V 占比越高偏得越多，多卡结果与单卡不可比；无任何报错或指标异常。
  trigger_surface: DeepSpeed clip_grad_norm + tensor-parallel multi-query GPTBigCode（c_attn 融合投影，weight/bias 标记 model-parallel）；TP>1
  discovery: 2026-11-09 每日扫描

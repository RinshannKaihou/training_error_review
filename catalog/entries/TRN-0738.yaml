  detail: '16 个微步、梯度本身在 bf16 精确的构造下，step() 前窗口和相对最大误差 2.4e-3（ZeRO-2 同配置为 0；a4c989b7 起既有，非 #9044 回归）。'
  visibility: 静默错误
mitigation:

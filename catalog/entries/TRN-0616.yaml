  detect: 编译前后对拍分布式 log-prob 期望值（-log(local_vocab×world_size)）；8 类 functional collective 生命周期回归（torch_npu test_collective_wait_lifetime.py）。
  fix: '修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/48875（open，未发布）；产品侧跟踪 torchtitan-ascend #19、适配 !85。'

title: Conv3D 反向 enlarge 尾组越界读致尾通道系统性错
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Conv3D dx ENLARGE tiling
  behavior: multiple_extend 不整除 groups 产生不完整尾放大组，尾组 K 轴 c0 对齐后 GEMM K 迭代越界读 dedy 外内存，输出依赖相邻内存内容；尾块 % 取余还会把有效列数置 0 漏算
effect:
  objects:
  - 梯度
  detail: Ascend950 bf16 转置卷积（groups=24、enlarge=16 不整除，典型 strideW=8 规格）输出通道 96-143 全错、0-95 全对，10/10 种子稳定复现；enlarge 整除时不受影响；无报错
  visibility: 静默错误
mitigation:
  detect: 按输出通道分组比对梯度（尾放大组通道整体超差是签名）；比对相邻内存清零与否会翻转结果的即为数据依赖错
  fix: 修复 MR !12064（open）：CalRealG 在 enlarge 不整除 groups 时回退 multiple_extend=1（ORIGIN 分组，无尾放大组）；CalBasicBlockCnt 尾块改减法式。实机 10/10 种子由 33.3% 元素超差转 bit-exact，11 例结构变体通过。https://gitcode.com/cann/ops-nn/merge_requests/12064

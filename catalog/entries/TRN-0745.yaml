original:
  mechanism: 'verl issue #8651（2026-11-11 open；main @ 1e125260）。skip.rollout_tq（enable=True, action=cache, steps=[N]）重放缓存步时，RolloutTqSkip.load_dump_data（verl/utils/skip/rollout_skip.py:339）重写轨迹键：循环 for session_id in range(n) 选 group[session_id % len(group)]，new_keys.append(f"{new_uid}_{session_id}_0")——index 后缀恒为 0，session_id 来自循环计数而非缓存行。agentic RL 一个会话可产多条轨迹（agent_loop_tq.py:198 按输出序号 i 写键 {uid}_{session_id}_{i}），因此：1) 缓存里 index>0 的轨迹全部被静默丢弃；2) 行跨会话改标——缓存组 [old_0_0,old_0_1,old_0_2,old_1_0]（会话 0 三条+会话 1 一条）在 n=2 下重放出 new_0_0=old_0_0、new_1_0=old_0_1，old_0_2 与 old_1_0 丢失、会话 0 的第 1 条被标为会话 1。2) 缓存重放尺寸由新 prompt 数推导（rollout.n 行/prompt），与缓存内容解耦。sync/colocate_async/separate_async 共用该路径。来源：https://github.com/verl-project/verl/issues/8651 。训练面：开 rollout 缓存重放的 agentic RL 训练步数据静默错位/丢失。'
  source: https://github.com/verl-project/verl/issues/8651
  behavior: 在 verl 开启 rollout_tq 缓存重放（skip.rollout_tq）训练 agentic RL 时：一个会话产出多条轨迹的话，重放出的缓存步里第 2 条及以后的轨迹被悄悄丢掉，剩下的行还会被贴到错误的会话编号下（内容与标签错位）、行数由新 prompt 数硬性决定——训练无报错，但这些缓存重放步的样本流已残缺错位，梯度喂的是错的数据。
  trigger_surface: verl V1 trainer + TransferQueue + skip.rollout_tq.enable/action=cache/steps 命中该步 + 单会话多轨迹（agentic）；issue open 无修复
  discovery: 2026-11-12 每日扫描

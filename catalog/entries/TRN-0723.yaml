original:
  mechanism: 'NVIDIA/Megatron-LM PR #9265（2026-11-10，open）。SwiGLU checkpoint factory 对 GTP 连续切片布局的映射假设失明：TP 内 [gate|up] 交错假设在 GTP 连续切分下不成立，行被分配到错误 checkpoint 区域。与 TRN-0244 同族：转换器对目标布局/重排失明、权重按错误位置静默写入（TRN-0244 为 verl FP8 refit 同形状 MoE 重排失明）。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/9265
  behavior: 用 GTP（权重重切）训练 SwiGLU/MoE 模型并把 ckpt 转换到不同 TP/GTP 组合时，转换出的 checkpoint 里 FC1 的 gate 行与 up 行部分放错位置（示例：四分之二的行互换区域）；转换不报错、大小正常，加载后模型看似能跑但权重已错位，loss 异常时很难怀疑到 ckpt 布局。

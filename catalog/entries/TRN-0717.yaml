original:
  mechanism: 'ops-nn !14144（2026-11-10，open，fixes #8230；A2 910B3 / CANN 9.2.0 修复前后真机复现矩阵 8 组阈值×边界向量）。原实现 aclnn_threshold_backward.cpp:150 用容差判零路由 + 文件级全局 thresholdVal_ 跨线程共享；修复：判零改精确比较 thresholdVal==0.0f（host 直接持有标量无浮点误差）、regbase int64 放行条件同步收紧、全局变量局部化为参数传递。UT 30/30，ATK ST 补 ±2^-24 对拍用例。'
  source: https://gitcode.com/cann/ops-nn/issues/8230 https://gitcode.com/cann/ops-nn/pull/14144
  behavior: 使用 threshold 激活反向时，若 threshold 是 1e-9~1.19e-7 的微小非零值，NPU 上梯度静默按 threshold=0（ReluGrad）计算：thr=-1e-7 本应保留 -5e-7 以外全部元素却输出与 thr=0 逐位相同的错值；多线程并发调用时任意大小的 threshold 都可能被另一线程竞态改写成 0，梯度错且无任何报错。
  discovery: 2026-11-11 每日扫描

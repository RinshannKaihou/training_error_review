original:
  mechanism: cann/ops-nn MR !12064（2026-10-16，修复 PR 自带根因与实机验证，无独立 issue）。Conv3DBackpropInputV2（dx，含 Conv3DTransposeV2 与 aclnnConvolution transposed 通路）在 GROUP_MODE_ENLARGE tiling 下：(1) CalRealG 计算的 multiple_extend 不整除 groups 时产生不完整尾放大组（groups=24、enlarge=16 时尾组仅 8 个原始分组），尾组 K 轴 DivCeilC0 对齐后 GEMM K 迭代范围超过尾组实际 dout 通道数，A 矩阵加载越界读 dedy 张量外内存，输出取决于相邻内存内容；(2) conv3d_dx_rowc_block.h CalBasicBlockCnt 的 nGroupCoreTail_ 用 % 取余，tailN 为 singleShapeN_ 正整数倍时结果为 0，把尾组最后一个 N 块有效列数误置 0，该块输出通道未被计算。修复：不整除时回退 ORIGIN 分组 + 尾块改减法式。实机（单卡 Ascend950）验证：原失败规格 10/10 随机种子由失败（33.3% 元素超差，坏通道 96-143）转 bit-exact；结构变体矩阵 11 例（groups=20/24/25/28/40/56 回退 ORIGIN、8/12/16/32/48 保留 ENLARGE）全过；回归无通过转判否。
  source: https://gitcode.com/cann/ops-nn/merge_requests/12064
  behavior: 在 Ascend950 上跑分组转置卷积反向（groups 不被 enlarge 整除，如 groups=24 且放大 16），梯度输出的尾放大组对应通道（本例 96-143 共 48 个通道）系统性错误、其余通道全对，多种子稳定复现；相邻内存恰为零时侥幸正确、为脏数据时错（数据依赖性）。无 crash、无告警，只有对参考实现逐通道比对才能发现。

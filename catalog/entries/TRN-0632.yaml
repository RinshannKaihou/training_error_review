title: MseLossBackward 元素数超 2^32 梯度部分未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MseLossGrad tiling 位宽
  behavior: arch22 tiling 把元素总数存入 uint32_t，超 2^32 静默截断：截为 K 时只算前 K 个、其余梯度从未写入但返回 SUCCESS；恰为 2^32 整数倍时 usedCoreNum=0 整除零返回内部码 361001。
effect:
  objects:
  - 梯度
  detail: fp16 reduction=none、self=1/target=0/gradOutput=1（应恒 2.0）：n=2^32 返 361001；n=2^32+K 返回 SUCCESS 但 out[n-1] 恒 0.0——2^32 后元素从未被任何核写过；A2 910B3/CANN 9.2.0 实测
  visibility: 静默错误
mitigation:
  detect: 超大 batch 维度 mse_loss 反向后检查输出末元素是否仍为预填值；tiling.h 的 totalLength 本就是 uint64，契约无 2^32 上限声明
  fix: 待定（issue open，未见修复 MR）

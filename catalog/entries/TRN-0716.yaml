original:
  mechanism: 'ops-transformer #7325（2026-11-10，open，910B3 / CANN 9.1.0）。aclnnLightningIndexerGrad：InitOutputDqAndDweights 对死行 dweights 的清零在奇偶分裂下每核零化元素数不满足 16 元素倍数时未写回/未覆盖未对齐尾部，死行残留脏值；代表 case 913（B2 S1=65536 N1=1）128626/131072 超阈、case 884 最大 1.18e+37；同输入三次运行脏值元素数不同是缓冲未初始化的直接证据。修复 PR !15684（open，WIP）。与 TRN-0442 同族：算子对声明输出区间（该写确定值的元素）未写、接口成功返回残留脏值——本条死行零化路径缺失、TRN-0442 为 BSND 尾部区间不写。'
  source: https://gitcode.com/cann/ops-transformer/issues/7325
  behavior: 使用者在滑窗裁剪（sparseMode=3）、query 长于 key（S1>S2 产生死行）且头分组数使零化粒度不齐时，反向的 dweights（索引器权重梯度）拿到未初始化内存值：量级从 0.6 到 1e+37、同输入两次运行结果可以不同；dq/dk 正常，若不单独对拍 dweights，该脏梯度会被直接用于更新索引器权重。
  discovery: 2026-11-11 每日扫描

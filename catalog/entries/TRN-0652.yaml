original:
  mechanism: 'Ascend/pytorch issue #5920（2026-11-06 open）：Ascend950DT（soc version 260）、torch 2.13.0/torch_npu 2.13.0+git5412c2f/CANN 9.2.0、TORCHINDUCTOR_NPU_BACKEND=triton_experimental：torch.compile(mm_div)（matmul 后除 8.0）与 eager 相比 max_abs 5.7~6.0；AlbertForMaskedLM（train）logits max_abs=1.56（dvm 后端 1.7e-06）。根因：static Triton launcher（torch_npu/_inductor/triton_experimental/static_launcher/，PR !45989 引入）在 A5（Ascend950，soc>=250）one-program-per-tile dispatch 形态下启动 kernel 的 grid/参数处理不正确，in-place pointwise kernel 被重复执行（输出被多次缩放）。证据链：① ic.use_static_triton_launcher=False 后最小复现 max_abs=0.0、Albert 1.86e-06；② 生成的 kernel 源码单独跑、逐步复现编译器完整流程（extern bmm→reinterpret→kernel）均完全正确；③ 坏区域 compiled/raw≈0.0119（0.125 的若干次幂）证明同一 in-place kernel 跑了多次；④ 尺寸阈值：[1,1,≤256,64]、[4,12,64,64] 全对，[4,12,128,64] 起错（55%），[4,12,512,64] 错 91.6%。910B（A2）不受影响（one-program-per-tile 仅 A5 形态）。issue 提供完整最小复现。推理库 INF-2430 同源，本条为训练范围条目（真实训练模型 AlbertForMaskedLM train 实测）。'
  source: https://gitcode.com/Ascend/pytorch/issues/5920 ；同源推理条目：INF-2430
  behavior: 在 Ascend950 上用 torch.compile（triton_experimental 后端）训练/前向时：含 in-place pointwise kernel 的编译图输出被反复缩放——matmul 后除以 8 的操作结果偏差 5.7~6.0（应 ~1e-6），真实模型（AlbertForMaskedLM train）logits 偏差 1.56；输入大到 [4,12,128,64] 起开始错（55% 元素），512 时 91.6% 错。全程无报错；把 use_static_triton_launcher 关掉或换 dvm 后端立即恢复正确，数值上表现为输出被 0.125 的幂次缩放。
  trigger_surface: torch_npu 2.13 triton_experimental 后端 + static launcher + A5（Ascend950，soc>=250）one-program-per-tile + in-place pointwise kernel + 较大 shape（≥[4,12,128,64] 量级）；CANN 9.2.0
  discovery: 2026-11-07 每日扫描

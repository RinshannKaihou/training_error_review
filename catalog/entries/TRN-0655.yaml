id: TRN-0655
legacy_ids: []
slug: triton_experimental_slice_scatter_out_of_slice_write
aliases: []
title: triton_experimental slice_scatter 误写片外数据
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: slice_scatter 融合改写
  behavior: 融合的 masked load/select 形式在负偏移钳制后丢失未选中前缀，切片外元素被源值覆盖；嵌套区域运行时输入写回路径重复修改 x[1:5] 时误改切片外 x[0]。
effect:
  objects:
  - 数值结果
  detail: torch.slice_scatter(x, src, 0, 1, 5) 编译执行把 x[0] 的 0.5 写成 0（eager 保留）；无报错，输入侧数据被静默改坏。
  visibility: 静默错误
mitigation:
  detect: slice_scatter 结果与 eager 对账；嵌套区域用例对输入写回前后快照比对。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49255（open 2026-11-07）：先物化输入副本再向视图写入 src，保留切片外数据与原输入；正/负边界、步长、空切片、非连续输入、来源别名 2 项 NPU 测试通过。未发布。

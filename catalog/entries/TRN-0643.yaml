original:
  mechanism: 'cann/ops-transformer issue #7222（2026-11-06 open）：aclnnMoeGatingTopKSoftmax 资料要求 yOut 末维等于 k（docs/aclnnMoeGatingTopKSoftmax.md:131），实现侧 moe_gating_top_k_softmax_tiling_base.cpp:46-72 的 CheckOutShape 只比较维数、dim0、3D 时 dim1，从未比较最后一维==k；:127/:132/:137 三个输出（yOut/expertIdxOut/rowIdxOut）都过该函数，证明「校验输出 shape」是既定意图、漏的只是末维比较。实测（自包含 C++ 直调）：k=2 时 yOut=[8,2] 合法基线 ret=0；yOut=[8,1]（末维少 1）ret=0 应拒未拒、ws=16777216 相同——kernel 按 k 列写而调用方 buffer 只有 1 列，越界写 GM 且无任何错误码（一轮挂 debug .o 的 memcheck 中目标 kernel 报连续越界；报告者如实标注该轮参数不可追溯、不作为主证据）。同接口 k 超上界正确返回 561103，证明仅末维比较缺失。关联 #7155（MoeFusedTopk IsEmpty 早退跳 19 项校验）为同仓 Moe 族 shape 校验系统性盲点的另一实例，两者互引。训练侧：MoE gating 是每层必经（gating_top_k_softmax 输出 yOut/expertIdx/rowIdx 进 expert 分派），aclnn 直调的 MoE 训练框架受害。'
  source: https://gitcode.com/cann/ops-transformer/issues/7222 ；同族盲点：https://gitcode.com/cann/ops-transformer/issues/7155 ；同源推理条目：INF-2437
  behavior: NPU 上调用 aclnnMoeGatingTopKSoftmax（或其 PTA 封装）时若 yOut 的最后一维因广播/切片/视图被写错成小于 k 的值：第一段接口返回 0（成功），随后 kernel 按 k 列写入而 buffer 不足，越界写显存、不产生任何错误码——轻则 gating 概率/专家索引数据被覆盖错乱，重则踩坏相邻张量（含其他梯度/权重 buffer）。gating 是 MoE 模型每层必经算子，错误会随训练持续累积且无报错。
  trigger_surface: aclnnMoeGatingTopKSoftmax + yOut 末维 < k 的非法出参（合法入参）；真机实测定位于 ops-transformer master（2c193867 已 fetch 仍在），硬件型号未列（C++ 直调复现）
  discovery: 2026-11-07 每日扫描

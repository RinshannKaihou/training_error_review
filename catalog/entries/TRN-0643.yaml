  - 数值结果
  - 模型权重
  detail: k=2 而 yOut=[8,1] 时第一段返回 0，kernel 按 2 列写、越界写 GM 无错误码（一轮 memcheck 观测，参数不可追溯已如实标注）；gating 是 MoE 每层必经算子。
  visibility: 静默错误
mitigation:
  detect: 调用前本地断言 out 末维==k（三输出 host 侧 shape 可得，比较零成本）。
  fix: 待定：issue open（2026-11-06），建议 CheckOutShape 补 GetDim(dimNum-1)==k（一处改动三输出全覆盖）+ 负向回归用例，未见 MR。

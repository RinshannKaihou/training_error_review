original:
  mechanism: 'cann/ops-math radix_top_k WS 变体（issue #3604，平台 ASCEND910B/910_93，配置目录仅含此两平台）三缺陷+UT 缺口：(1) HandleLastRoundBoundary 中 Add 在 V 流水线写 tileTopK、MTE3 经 CopyTileTopKUb2Ws 读同块 UB，原 SToMTE3Sync 覆盖不到 V→MTE3，MTE3 可读旧值→该段 k 配额错乱（AddTileHist2TileTopKInWs 对同序列已用 VToMTE3Sync）；(2) i64 多段 regime 命中 tileNum_>MAX_TILE_NUM_IN_UB 时 CreateVecIndex4TopK 的 MAX_TILE_NUM_IN_UB-tileNumAlign_ 无符号下溢被 tileLen_ 兜住，GetWithOffset 偏移写出 6144 元素 buffer；(3) 跨核前缀和（CopyOutBoundaryBinCumSum→ComputeCumSumPrev）总量可达 sortLen>2^31 而 UB 变体累加器为 int32（WS 有只差类型的 ComputeCumSumPrevI64）。UT ComputeExpectedTilingKey 只编码 3 位未含 isInt64Shape（bit3），int64 主路径恒测不到。修复 MR !6396（open WIP）：三处修复+static_assert(LARGE_SORT_LEN<INT32_SORT_LEN_MAX)+UT 补充+README 约束说明。'
  source: https://gitcode.com/cann/ops-math/issues/3604 ；修复：https://gitcode.com/cann/ops-math/merge_requests/6396
  behavior: 超大 sortLen（>2^31，约 21 亿元素）的 int64 topk（MoE 大词表/超长序列采样场景）：输出 k 配额错乱（少选/多选）、索引越界写破坏相邻内存或跨核前缀和溢出错值，均无报错；普通规模 topk 完全正常，只有 int64 大 shape 且 K 配额需末轮边界补齐时触发，规模门槛使问题在生产前难以暴露。
  discovery: 2026-10-16 每日扫描

title: foreach Norm 非 1/2 阶静默错 + NaN 幂返 1
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: foreach norm/幂族适配
  behavior: ForeachNorm 只实现 p=1/2 两分支，其余 p 静默落相邻分支返回 L1/L2；foreach 幂族把 NaN 指数当 0 次幂处理，非负底数 x^nan 返 1.0；同机单算子 pow/norm 均正确
effect:
  objects:
  - 数值结果
  - 梯度
  detail: p=3/2.5/0.5/±inf/nan 全部静默返回 L1 或 L2 结果（p=0.5 差 1 万倍，nan 返有限值）；x^nan 非负底数返 1.0（IEEE/torch 应返 nan），torch._foreach_norm/_foreach_pow 直接可达，两段返回 0
  visibility: 静默错误
mitigation:
  detect: foreach 路径与单算子路径结果对照（同机 torch.linalg.vector_norm(x,1.5) 正确）；NaN 指数哨兵用例
  fix: 待定（两 issue 2026-11-03 open，未见修复 MR）

original:
  mechanism: 'cann/ops-nn #8078（2026-11-04 open）+ 修复 !13576：GeGluGradV2 的 FP16 路径先用 half 计算 linear*dy 再把乘积转 float；中间乘积一旦超 FP16 最大 65504，后续升精度无法恢复，而激活导数小于 1 时最终梯度本可能仍在 FP16 范围内。示例 linear=300、dy=300、gate=-1、approximate=1：中间乘积 90000 溢出，float64 参考约 -7466.77、收窄 FP16 为 -7468 仍有限，当前注册 NumPy golden 返回 -inf 并报 overflow encountered in multiply。四个当前入口使用的 FP16 实现（arch35 tanh/erf、通用、310p）同一计算顺序，为源码路径核对（设备端未实测，golden 非有限已在 CPU 复现）。注册 golden 144 项中原版 112 通过/32 个 FP16 溢出用例失败；修订（先升 FP32 再乘）后 144 通过；恢复 FP16 中间乘积的 golden 变异相同 32 项重新失败。混合精度训练中较大线性分支激活+上游梯度可产生该中间范围。基线 master 14e7f2f05。'
  source: https://gitcode.com/cann/ops-nn/issues/8078 ｜修复 PR：https://gitcode.com/cann/ops-nn/merge_requests/13576
  behavior: 混合精度训练里 GeGLU 激活的反向梯度在 linear 分支激活值与上游梯度都较大（数百量级、乘积超 65504）时输出 ±inf 而非有限梯度（正确值约 -7468 这种量级），无报错；inf 梯度回传会污染后续梯度链或触发 loss 异常。常规小数值训练不受影响，golden 套件 144 项中 32 项此类边界失败，平时难暴露。
  trigger_surface: CANN GeGluGradV2 FP16 路径（arch35 tanh/erf、通用 fp16、310p 四入口）+ linear*dy 中间乘积超 65504 + gelu 导数<1；混合精度大激活训练

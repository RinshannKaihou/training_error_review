original:
  mechanism: 'cann/ops-nn #8379（2026-11-07 open）：aclnnAddRmsNormQuant 在 Atlas A2（910B2）上 x1/x2/gamma/xOut 同为 FLOAT32 时，第一段 GetWorkspaceSize 返回 0、第二段执行返回 561000（ACLNN_ERR_INNER）；资料对 A2/A3 明确写该四参数仅支持 FLOAT16/BFLOAT16，不支持 dtype 应在第一段返回 161002。同接口 x2 与 x1 不一致（fp16 vs fp32）时第一段已能 161002，说明校验路径存在但没覆盖「x 侧全 FLOAT32」组合。源码复核（d1efef7c30，2026-11-07 20:52）：aclnn_add_rms_norm_quant.cpp:49/52 的 x/scales 支持列表含 DT_FLOAT、:95 起为 DT_FLOAT 分支，未见 A2 平台额外拒绝——与实测一致。环境：910B2、CANN 9.2.0、g++ 11.4。训练面：动态 dtype 管线误配 fp32 时首段绿灯、执行段才报内部错（错误信息不含参数语义，定位成本高）；量化归约算子链路误配面。终态 fail-loud 非静默错值——按首段契约违反收录为校验分层族边界案例。'
  source: https://gitcode.com/cann/ops-nn/issues/8379
  behavior: Atlas A2 上调用 aclnnAddRmsNormQuant 且 x1/x2/gamma/xOut 全为 FLOAT32（资料写不支持）：第一段返回 0（成功），第二段才返回 561000 内部错误——错误码不含「dtype 不支持」语义，调用方无法在第一段预检拦截；把 x2 换成与 x1 不一致的 dtype 反而第一段就能正确返回 161002。表现为执行期报错而非静默错值。
  trigger_surface: CANN ops-nn aclnnAddRmsNormQuant + Atlas A2(910B2) + x1/x2/gamma/xOut 全 FLOAT32；CANN 9.2.0 实测；master d1efef7c30 缺陷仍在

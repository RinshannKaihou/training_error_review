original:
  mechanism: 'NVIDIA/Megatron-LM #9056（[dev] lite，open PR，2026-11-06）：Megatron Lite + 分布式优化器 + overlap_param_gather（默认开）下，optimizer step 后各 DP rank 只持有自己分片的更新参数；Megatron-Core DDP 在 forward pre-hook 里 gather 其余分片，但 hook 只覆盖被调用模块的参数。三处绕过：①TopKRouter/SigmoidTopKRouter 以 functional 方式使用 router gate 权重；②VocabParallelEmbedding functional 使用 embedding 表；③checkpoint 保存与权重导出在 forward 之外读参数。非持有 shard 的 rank 使用上一步的值；保存/导出读到未完成 gather 的分片。修复：把 GEMM/lookup 移入 _RouterGate/_LookupEmbedding 各自模块的 forward（参数名/初始化/数值不变）、保存前强制 pending all-gather（sync_overlapped_params，对齐 Megatron-LM 训练侧）；新增 test_param_sync_hooks_unit / test_sync_overlapped_params_unit，experimental/lite 774 通过（dev@c4220af 771）。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/9056
  behavior: Megatron Lite 开 overlap_param_gather（默认）训练：router gate 与 embedding 在非持有分片的 DP rank 上用的是上一步的参数值，router 概率与前向输出有一步滞后的静默偏差，无报错、loss 正常；checkpoint 保存与权重导出也可能写入未完成 all-gather 的分片参数——导出权重与训练态不一致，最终模型质量受损且难归因。
  trigger_surface: Megatron Lite（experimental/lite dev）+ 分布式优化器 + overlap_param_gather（默认开）；全部 Lite 模型
  discovery: 2026-11-10 每日扫描

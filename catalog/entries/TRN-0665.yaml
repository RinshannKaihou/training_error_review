  fix: issue 给出修复建议（atomic<u32> release/acquire 或读间 acquire fence；环满等待循环内周期性 RefreshSqHead；PollCompletion 守卫自愈），作者暂不处理（2026-11-06 回复），未见修复 PR（2026-11-07 复核 head de99de1a 未修改）。

title: SparseApplyAdadelta 先除后乘中间量下溢
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: cann
    component: SparseApplyAdadelta
  behavior: update 按 sqrtf(numer)*(g/sqrtf(denom)) 先除后乘，与 README/TF 参考 (sqrt(numer)/sqrt(denom))*g 浮点不等价，denom 大 g 小时中间商下溢为 0。
effect:
  objects:
  - 模型权重
  detail: 构造 denom=1e20、g=1e-20 时 g/sqrt(denom) 中间结果下溢为 0，update 静默变 0（参考非 0），稀疏嵌入行更新被吞；同 issue 另有 tiling/infershape 缺校验的越界风险。
  visibility: 静默错误
mitigation:
  detect: 极小 grad/极大 accum 组合与 TF 参考对账 update 是否为 0；长时间训练后 update 范数监控
  fix: 待定（issue open，未见修复 PR；期望按参考公式 (sqrt(numer)/sqrt(denom))*g 计算）

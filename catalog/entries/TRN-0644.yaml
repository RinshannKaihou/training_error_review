id: TRN-0644
legacy_ids: []
slug: cann_blocksparse_attention_allzero_mask_unwritten
aliases: []
title: BlockSparseAttention V1 全 0 掩码输出未写返回成功
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: 有效块早退不写输出
  behavior: blockSparseMask 全 0（无任何可参与 KV 块）时 kernel 直接跳过该行/块计算，未调用等价空行写出逻辑，attentionOut 未被写即返回 0/0。
effect:
  objects:
  - 数值结果
  detail: 全 0 mask 用例两段 rc=0/0 但 attentionOut 16384/16384 元素保持哨兵 7.0；全 1 对照组正常写入——输出值依赖调用方缓冲区残留。
  visibility: 静默错误
mitigation:
  detect: 输出预填哨兵做 round-trip；全 0 mask 冒烟用例（应写 0/中性值）。
  fix: '待定：issue open（2026-11-06）；同根因先例 #6751（GenericBlockSparseAttention 因果过滤后有效块为零提前 continue）已 closed。'
labels:
  stage:
  - shared
  confidence: verified
  coverage: var
  discovered: '2026-11-07'
remarks: 「有效块数为零→输出未写」与空输入早退族同属「快路径不写输出」机制（触发是掩码语义而非张量为空），故 var→TRN-0275；推理库 INF-1576 已收 V3 版同机制（#5718），V1 本轮推理侧未建、训练条目独立。

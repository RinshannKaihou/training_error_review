title: BatchNormElemt invstd 反解方差灾难性抵消与 fp16 下溢
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: batch_norm_elemt 适配层
  behavior: op_api 适配层由 invstd 反解方差时存在四类缺陷：eps 参与抵消；负 invstd 丢失符号；eps 取值异常时结果全错；fp16 统计量下方差下溢为 NaN。
effect:
  objects:
  - 数值结果
  detail: invstd 与 eps 量级接近时输出相对误差实测可达 2.2%；invstd 为负时符号被吞；eps 异常时输出全错；方差极小的窄通道（fp16 下 std<2.4e-4 真实存在）invstd 很大时输出全 NaN。均静默发生，fp32 常规输入看似正常。
  visibility: 静默错误

original:
  mechanism: 'ops-transformer #7237 aclnnMoeFusedTopk：CheckShape 首行 if (x->IsEmpty()) return true 短路 topK>0、topK<=expertNum、y/x 第 0 维一致等全部约束，GetWorkspaceSize 在 :280-284 再次判空直接 return ACLNN_SUCCESS，不生成写 y/indices 的算子（x=[4,0]、y/indices=[4,2] 非空，实测 0/0 未写）。#7236 aclnnMoeTokenPermuteWithRoutingMapGrad：早退只判 permutedTokenOutputGrad/tokensGradOut 为空（aclnn_moe_token_permute_with_routing_map_grad.cpp:468），probsGradOut=[4,4] 一个字节未写（对照组 hidden=2 写出 1 3 0 0 0 4 5 0，probs 梯度与 hidden 无关本应逐值一致）。#7238 aclnnLightningIndexerKLLoss：targetScore=[4,0,8] 或 [0,8]（B/K 合法、S/T=0）时标量 loss=[1] 未写（对照 -88.7228；aclnn_lightning_indexer_kl_loss.cpp:146-150）。ops-nn #8387 aclnnSoftmaxCrossEntropyWithLogits：features=[4,0] 时 loss=[4] 未写（对照 0.823959×4；:122-126 早退分支无写 loss 算子；#1497 早年把空输入从拦截报错改为返回 SUCCESS 留下的另一半）。ops-nn #8389 aclnnEmbeddingBag：indices 空、offsets=[0]/[0,0] 时 output=(numBags,D) 整块保持未初始化（aclnn_embedding_bag.cpp:414-418；对照 10.0）。环境：Atlas A2 910B2、CANN 9.3.0；ops-transformer master 5adf800c、ops-nn master d1efef7c；复现日期 2026-11-08。与 TRN-0275/TRN-0659 同机制（host 侧空输入早退不写非空出参）第三批，ops-transformer 侧首批。'
  source: https://gitcode.com/cann/ops-transformer/issues/7237 ｜ https://gitcode.com/cann/ops-transformer/issues/7236 ｜ https://gitcode.com/cann/ops-transformer/issues/7238 ｜ https://gitcode.com/cann/ops-nn/issues/8387 ｜ https://gitcode.com/cann/ops-nn/issues/8389
  behavior: 给这些 aclnn 算子传 0 元素张量（如空 indices、S=0 的 targetScore、C=0 的 features、空 x 的 MoeFusedTopk）：两段 API 都返回成功（0/0），但非空输出张量一个字节都没写——读回仍是调用方预填的 canary 值（3.39615e+38 / 0x7F）。若训练图里后续算子直接消费该输出，拿到的是未初始化内存里的值；全程无错误码、无告警，只有预填哨兵值或与 CPU 对账才能发现。
  trigger_surface: Atlas A2 910B2、CANN 9.3.0；aclnnMoeFusedTopk / MoeTokenPermuteWithRoutingMapGrad / LightningIndexerKLLoss / SoftmaxCrossEntropyWithLogits / EmbeddingBag 空输入（0 元素）+ 非空输出组合

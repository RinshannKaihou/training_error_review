original:
  mechanism: 'ops-math #4620（open；Atlas A2 910B2、CANN 9.3.0、master aae0dcf0，2026-11-08 18:40 复核仍在）：A2 走 opp/built-in/op_impl/ai_core/tbe/impl/ops_legacy/floor_div.py:64-67 的 vdiv→floor→cast，无余数校正；0.5/0.1f（fp32）真商 4.999999925 应 4 实得 5、-3.5/0.7f 真商 -5.000000085 应 -6 实得 -5；初版『标量入口正确、缺陷只在张量路径』被控制变量对照推翻——当时标量传的是 double 0.1（真商恰 5.0 天然正确），标量也传 fp32 0.1f 后同样偏差，缺陷覆盖全部入口。#4619 aclnnRemainderTensorTensor：self/other 以 IEEE-754 位型精确构造，元素 0 真商 -6.000000157 应 floor -7、余数 0.378947109，实现输出≈0，绝对误差=|other|（0.379，100%）。资料（floor_div.md:30/:403、floor_mod.md:31/:73）要求对实数商取 floor 且 A2 声明支持 FLOAT，fp32 口径 max_abs_error<=max(1e-2,32*ULP) 被恒定超差。推理库 INF-2459/INF-2462 已分别收同源两算子。'

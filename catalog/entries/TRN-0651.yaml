original:
  mechanism: 'NVIDIA/Megatron-LM issue #8808（2026-11-01 open）：--moe-router-load-balancing-type seq_aux_loss 或 global_aux_loss 时，training_log 在真实 seq/global_load_balancing_loss 旁上报伪 load_balancing_loss: 0（控制台、TensorBoard、W&B 三处）。机制：validate_args 把 load balancing type 存为普通字符串，training_log 检查 "aux_loss" in args.moe_router_load_balancing_type（megatron/training/training.py）——对字符串是子串测试，seq_aux_loss/global_aux_loss 也为真 → load_balancing_loss 加入 track_names → MoEMetricsTracker.report(force_initialize=True) 把它预创建为全 0（router 对这些类型从不记录该指标）。复现：任一 MoE 配置 + seq_aux_loss，真实 tracker（gloo、world size 1）显示 {''load_balancing_loss'': tensor(0.), ''seq_load_balancing_loss'': tensor(0.5000)}。aux_loss 本体、列表值、sinkhorn、none、quantile_balancing 行为正确，仅单字符串 seq_/global_ 变体受害。comments=1（2026-11-03 后无更新，本轮未取评论内容）。'
  source: https://github.com/NVIDIA/Megatron-LM/issues/8808
  behavior: Megatron-LM MoE 训练配 --moe-router-load-balancing-type seq_aux_loss（或 global_aux_loss）时：控制台日志、TensorBoard、W&B 里在真实的 seq_load_balancing_loss 之外多出一条恒为 0 的 load_balancing_loss 指标——训练本身正常，但读表的人/脚本会把 0 当真实均衡损失，基于日志的 MoE 均衡性监控与告警被静默污染（如以 load_balancing_loss 阈值告警的管道永不触发）。
  trigger_surface: Megatron-LM MoE + 单字符串 --moe-router-load-balancing-type seq_aux_loss/global_aux_loss；版本未列（main 行为）
  discovery: 2026-11-07 每日扫描

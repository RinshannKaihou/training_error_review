title: MaxPoolGradWithArgmax NHWC 小 C 切分解码错梯度散
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MaxPoolGrad NHWC tiling
  behavior: Argmax 用全局 (h·W+w)·C+c 编码，DoMulCNhwc 还原 h/w 却用块内 C 做除数；tiling 无条件收缩 cOutputInner，块内 C<完整 C 时解码错误，梯度散错位置或被丢弃。
effect:
  objects:
  - 梯度
  detail: 梯度被散射到错误位置或被 Range Check 丢弃；fp32/bf16 NHWC 小 C 用例（完整 C=2/3/15，块内 1~2）精度 FAIL，C≥阈值及 NCHW 路径正常。
  visibility: 静默错误
mitigation:
  detect: NHWC 小 C 的 maxpool 反向与 CPU 对账；构造完整 C 小于 vRegSize/(2·indexBytes) 阈值的用例。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/13770（open 2026-11-05）：仅完整 C 超过 BigC 阈值才继续切 C；静态分析 4 FAIL 用例修复后不再切；黄区回归待做、蓝区无 950 未上板。未发布。

remarks: 与 TRN-0421（索引/可选输入 shape 校验缺失族）同为「校验不完整」，但对象是 MoE gating 输出、后果是 kernel 越界写而非仅放行；训练 MoE 前向+反向 gating 必经。推理库 INF-2437 同源已收。 本库内独立建条（TRN-0421 为入参校验族且无越界写实测），跨库同源 cross→INF-2437。

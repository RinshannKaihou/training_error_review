title: BNTrainingReduceGrad 大 diff_scale 抵消成噪声
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: bn_training_reduce_grad a
  behavior: 主循环按『先乘后加』计算 multiplier*x 与 addend 首项两个 ~1e37 量级项再相加，fp32 无法保真表示该量级中间值，本应精确相消的两项相减成灾难性抵消，输出退化为噪声
effect:
  objects:
  - 梯度
  detail: '|diff_scale| 接近 FLT_MAX 且 x==batch_mean 时输出退化为舍入噪声（fp64 参考严重不符）；x!=batch_mean 常规用例正常，Ascend 950 arch35 逐 plane 与 R==1/R==2 合并路径同受影响'
  visibility: 静默错误
mitigation:
  detect: 构造 x==batch_mean 且大 diff_scale 用例与 fp64 参考对拍（Sterbenz 论证相近数相减精确）
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13555 （open）：主循环改『先差后乘』等价式 y=((grads+multiplier*(x-batch_mean))+addend)*mulScale，代数恒等重排不改语义；未核实合入

id: TRN-0657
legacy_ids: []
slug: abs_complex64_exponent_normalization
aliases: []
title: abs complex64 指数因子归一化仅 A∈[1,2) 正确
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: abs complex64 kernel
  behavior: abs complex_dag 路径 vB1=(B−2^k)+1 仅 A∈[1,2) 时等于 B/2^k；两分量跨 binade 或量级差大时算 2^k·sqrt((A/2^k)²+(B−2^k+1)²)，偏离 sqrt(A²+B²)。
effect:
  objects:
  - 数值结果
  detail: A=3.0,B=1.0 得 4.0（真值 √10≈3.162，相对误差 26.5%）；A=4.0,B=2.0 得 5.657（真值 √20≈4.472，同样 26.5%）；同量级输入正常，无报错。
  visibility: 静默错误
mitigation:
  detect: 跨 binade/量级差大的 complex64 abs 与 CPU sqrt(A²+B²) 对账；构造 A∈[2,4) 系列用例。
  fix: 修复 PR https://gitcode.com/cann/ops-math/merge_requests/7201（open 2026-11-07）：改标准数值稳定公式 |z|=A·sqrt(1+(B/A)²)；arch35 验收标准含 subnormal/B=0 边界。未发布。

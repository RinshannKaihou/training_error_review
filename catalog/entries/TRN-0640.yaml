id: TRN-0640
legacy_ids: []
slug: aclnn_norm_eps_negative_nan_family
aliases: []
title: norm 族 eps<0 放行静默输出全 NaN（三算子同型）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: norm 族 eps 值域校验缺失
  behavior: aclnnLayerNorm/FastLayerNorm/BatchNorm 的 host 侧校验不含 eps 值域，eps<0 放行执行；Var+eps<0 时 rstd=1/sqrt(负数) 产出整块 NaN。
effect:
  objects:
  - 数值结果
  detail: eps=-1 且输入方差<1 时 out/rstdOut/saveInvstd 整块 NaN（512/512、256/256 元素实测），mean/saveMean 正常；同输入幅度大方差（Var>1）不触发——数据相关静默失败，两段 rc=0/0。
  visibility: 数值异常
mitigation:
  detect: eps>0 前置断言；小方差输入 + 负 eps 冒烟用例对拍（mean 正常而 out 全 NaN 是该机理签名）。
  fix: 待定：三单均 open（2026-11-06），同族 aclnnAddRmsNorm 已有 CheckAttr epsilon>=0 拒绝先例（161002），未见对齐 MR。
labels:
  stage:
  - pretrain
  - sft
  confidence: verified
  coverage: NEW
  discovered: '2026-11-07'
remarks: 与 TRN-0275「空输入早退」不同族：本条是标量属性值域校验缺失（host 侧 double 直接可得，校验成本为零），非空性联动问题。推理库 INF-2434 同源三单已收；本条为训练范围条目（LN/BN 为训练主干算子）。 本库内为新机制族（标量属性值域校验缺失），与推理库同源条目以 cross 关联。

  detail: 含 NaN 输入的编译图 max/min/argmax/argmin 与 eager 结果不一致（NaN 丢失/索引错行）；online softmax 循环形态另静默回落两遍形式（数值近似对、机制失效）。
  visibility: 静默错误
mitigation:
  detect: NaN/±inf 传播用例对拍 eager（75 项 test_online_softmax_npu.py 套件）。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49041（open）：_extremum 改 -tl.max(-value) 等价传播 NaN、掩码补 value!=value、补 online_softmax_reduce 循环携带分支（default 后端 73 PASS/0 FAIL/2 已知 ERROR）。未发布。

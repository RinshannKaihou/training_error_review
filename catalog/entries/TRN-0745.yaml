    component: RolloutTqSkip 重放
  behavior: 缓存重放循环把轨迹键硬编码 index=0 后缀，并按新 prompt 数强行填 rollout.n 行、以循环计数当 session_id 选组——不读缓存键的真实 session/index 语义。

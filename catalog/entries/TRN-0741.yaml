original:
  mechanism: 'OpenRLHF issue #1394（2026-11-05 open；main @ 2649449）+ 修复 PR #1395（open）。openrlhf.utils.math_utils 的 grade_answer_sympy 元素循环：if _is_frac(gt) and _is_frac(given) 走字符串相等比较（不约分）、elif _str_is_int(gt) != _str_is_int(given) 直接判 False——两分支都在 are_equal_under_sympy 之前短路，sympy 符号等价判定从未到达。实测 grade_answer("\\frac{2}{4}", "\\frac{1}{2}")=False、("8/2","4")=False、("2*2","4")=False、("\\sqrt{4}","2")=False、("0.5+0.5","1")=False，全部应为 True；are_equal_under_sympy 可证全部等价。该函数是数学 RLVR 的奖励：正确答案因写法得零奖励，教会模型形式比值重要；等价分数与 sqrt(4) 式答案在 GSM8K/MATH rollout 常见。修复 #1395：短路前先符号化归约，保留 9**9**9 指数防护不重引入挂起。来源：https://github.com/OpenRLHF/OpenRLHF/issues/1394 、修复 https://github.com/OpenRLHF/OpenRLHF/pull/1395 。训练面：数学 RLVR 奖励分布系统性偏低并扭曲。'
  source: https://github.com/OpenRLHF/OpenRLHF/issues/1394 ｜修复 PR：https://github.com/OpenRLHF/OpenRLHF/pull/1395
  behavior: 用 OpenRLHF 做数学 RLVR 时，答案判分器把数学上等价但写法不同的正确答案判为错：2/4 对 1/2、8/2 对 4、sqrt(4) 对 2、0.5+0.5 对 1 全部得 0 分——这些写法在 GSM8K/MATH 的模型输出里很常见。训练无报错，只是奖励比应有的低、且模型被引导去模仿特定答案格式而不是解对题，真实能力与奖励曲线脱节。
  trigger_surface: 'OpenRLHF grade_answer/grade_answer_sympy 数学 RLVR 计分；双侧分数形式或单侧整数字面量输入；修复 #1395 open 未合'
  discovery: 2026-11-12 每日扫描
migration:

original:
  mechanism: 'DeepSpeed PR #9015/#9016（2026-11-04 open，xylian86，带 2×GH200 ZeRO-3/1/2 bf16 FusedAdam 前后对照实测）修复的 offload_states/reload_states 静默状态回退族：ZeRO-3（#9015）两处——(1) offload_states() 按模块序把所有参数映射到 lp_param_buffer，而该 buffer 只含优化器训练参数的分区（优化器序），含 frozen 参数时直接 RuntimeError；(2) offload_states(pin_memory=True) 之后再 offload_states(pin_memory=False) 把当前值放进新的 pageable 拷贝，但 reload_states() 仍从第一次的 pinned 缓冲恢复 fp32 masters/bf16 分区/梯度缓冲——训练静默接着旧值继续（Adam lr 1e-2 下参数偏差至 1.0e-2，实测修复后 bit 一致）。ZeRO-1/2（#9016）：优化器状态 fragment（_hp_mapping.optim_fragment，safe_get/set_full_optimizer_state 使用）在第一步后以 narrow() 视图挂载一次，offload/reload 替换状态张量但从不重挂——offload_states(include=[optim_states]) 释放 0 字节（视图保活）且 reload 后 getters 返回 offload 前旧值；reload hp_params/lp_params 时 fragment 无优化器状态可挂，getters 抛 TypeError。修复：#9015 修映射与 reload 一致性（frozen 层前后 bit 一致）；#9016 在 offload 前解除 fragment 视图、reload 末尾重挂（128MiB 正确释放、一步后 fragment 与状态相等）。RL 训练阶段间释放显存（rollout 前后）正是该 API 的设计场景。'
  source: https://github.com/deepspeedai/DeepSpeed/pull/9015 + https://github.com/deepspeedai/DeepSpeed/pull/9016 （均 open，附复现与前后对照）
  behavior: ZeRO 训练在阶段之间用 offload_states()/reload_states() 释放/恢复显存（典型：RL rollout 前后）后：模型悄悄接着旧参数/旧优化器状态继续训练——ZeRO-3 下 pin_memory 组合变化后 fp32 master 与 bf16 参数回退到上一次 offload 时的值（lr 1e-2 时偏差 1e-2 量级），ZeRO-1/2 下优化器状态读取接口返回 offload 前的旧值或直接 TypeError；无报错、loss 曲线看不出台阶，训练质量静默受损。含 frozen 参数的 ZeRO-3 则在 offload 时直接 RuntimeError。
  trigger_surface: DeepSpeed ZeRO-1/2/3 + engine.offload_states()/reload_states()（RL rollout 间显存释放等阶段切换场景）+ pin_memory 变化或 frozen 参数；2×GH200 bf16 FusedAdam 实测
  discovery: 2026-11-06 每日扫描

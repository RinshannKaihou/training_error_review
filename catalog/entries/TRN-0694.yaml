original:
  mechanism: 'cann/ops-math #4650（2026-11-09 open）：conversion/trans_data/op_host/trans_data_infershape.cpp 的 RT2 infershape 直接使用逐元素 shape 传播函数，无条件将输入 shape 写入输出；RT1 仅在输入、输出 origin format 相同时传播 shape。origin format 不同时（如输入 NHWC shape [2,4,5,3]、输出 NCHW 已有 shape [2,3,4,5]），RT2 把输出错误覆盖为 [2,4,5,3]，后续格式转换失败。判断依据应为 origin format 而非 storage format；对照实现 canndev ops/built-in/op_proto/transformation_ops.cc 的 TransDataInferShape。端到端验证：Ascend 910B3、CANN 9.2.0，NHWC 与 NC1HWC0 双向转换两个 origin format 不同场景复现。训练面：图编译/格式转换链路的输出 shape 元数据被静默破坏。'
  source: https://gitcode.com/cann/ops-math/issues/4650
  behavior: 构造输入、输出 origin format 不同的 TransData 并预设输出 shape：RT2 infershape 把输出 shape 无条件覆盖成输入 shape（NCHW 输出被写成 NHWC 的 [2,4,5,3]），无报错；后续按该 shape 做格式转换失败或生成错误布局，错误在下游才显式化，与 RT1 行为不一致可对照定位。
  trigger_surface: Ascend 910B3、CANN 9.2.0；TransData RT2 infershape、输入输出 origin format 不同
  discovery: 2026-11-10 每日扫描

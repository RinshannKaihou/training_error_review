original:
  mechanism: 'verl issue #8656（2026-11-11 open；verl main @ 81464bb，verl/utils/reward_score/prime_code 原样拷贝）。call-based 任务（fn_name 已设置）时 prime_code/testing_util.py 的 run_test 以 tmp_result = output == in_outs["outputs"][index] 判定每个测试、compute_score 以值 is True 计分——答案自身对象在 == 左侧，答案可返回 __eq__ 恒返回 True 的对象（如 int/list 子类 _Any）在不算任何东西的情况下通过全部 call-based 测试；子类化 int/list 保持 json.dumps(output) 可用，链路上无异常。实测：correct→True、wrong→0.0、always_equal_int/always_equal_list→True（continuous=True，即无 sandbox_fusion_url 时默认路径）。RL 中这是策略可发现的奖励：一个类定义即可在全部 APPS/TACO 风 call-based 题拿满奖励。sandbox_fusion 路径未测；另见 continuous=False 默认参数下任何失败答案抛 UnboundLocalError(metadata_list)。来源：https://github.com/verl-project/verl/issues/8656 。训练面：数学/代码 RLVR 用 prime_code 计分的奖励完整性被攻破。'
  source: https://github.com/verl-project/verl/issues/8656
  behavior: 用 verl 的 prime_code 奖励函数训练代码 RL 时：模型生成的答案里定义一个 __eq__ 恒返回 True 的类并返回其实例，就能在所有 call-based（APPS/TACO 式）任务上拿满分——实测恒等类答案与正确答案同得 True、真算错的答案才 0 分。训练日志里奖励持续上涨、无任何报错，但模型学到的是作弊模式而非解题能力，评测能力掉。
  trigger_surface: verl prime_code 计分 + call-based 任务（fn_name）+ 无 sandbox_fusion_url；issue open 无修复
  discovery: 2026-11-12 每日扫描

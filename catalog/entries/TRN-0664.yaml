relations: []
original:
  mechanism: 'verl #8564（2026-11-05 open PR，含问题与修复）：scripts/rollout_logprob_diff.py --refit-rounds N 的假通过——早期 refit 轮可超 mismatch 阈值或产出非有限指标，但脚本只检查最后一轮摘要，最终轮健康即返回成功（脚本记录每一轮却只查最后）。影响：QAT/低精度对齐检查的验收结果失真——训推 logprob 一致性（TIM 面）验收可能因末轮恢复而放过早期轮的 KL 超阈/NaN。修复：用既有 finite-kl/k3_kl 与 k3_kl<--max-k3-kl 条件校验每个已记录轮次，任一轮失败返回失败并报一轮起始轮号与指标；所有轮仍测量、last-round JSON 摘要与 refit_runs 全史保留。回归：29 项 CPU 测试（真实脚本 main()、隔离分布式依赖），覆盖首轮/中轮/末轮失败、阈值相等、NaN/±Inf、多轮失败报告、健康/单轮；原始脚本 27 失败/2 过（17 个证实假成功退出码），修复后 29/29 过；另 30 项 CPU+2×H100 隔离 harness 过。相关 foundation #8287。不改量化与训练数值。'
  source: https://github.com/verl-project/verl/pull/8564
  behavior: 用 verl scripts/rollout_logprob_diff.py --refit-rounds N 做 rollout↔train logprob 对拍验收（如 QAT/低精度对齐）：当第 1 轮 refit 的 kl/k3_kl 超阈或为 NaN/Inf、而最后一轮恢复正常时，脚本打印 PASSED、退出码 0——验收通过是假的。实测 17 个用例证实假成功退出码；多轮中任何一轮的静默劣化都被末轮掩盖，TIM 回归被漏检。
  trigger_surface: 'verl scripts/rollout_logprob_diff.py + --refit-rounds>1 + 早期轮超阈/非有限而末轮健康；CPU 回归与 H100 harness 实证；修复 #8564 open 未合'
  discovery: 2026-11-08 每日扫描

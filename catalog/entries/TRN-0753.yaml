original:
  mechanism: 'Ascend/pytorch issue #6073 报告：torch_npu 环境设 TORCHINDUCTOR_NPU_BACKEND=dvm 后，torch.compile(model, fullgraph=True) 编译训练态 F.batch_norm（F.batch_norm(x, None, None, weight, bias, training=True).relu().sum()）时，前向与 NPU eager 逐位一致（max abs diff 0），但反向梯度明显偏离：fp32、输入 4x3x8x8、无 running statistics、x/weight/bias 三者都需梯度，实测 x grad max abs diff 3.8860352、weight grad 37.968235、bias grad 0，509/768 元素超差（66.3%），最大相对差 14.45。环境 Huawei Cloud EulerOS 2.0 AArch64、Ascend 910B4 单卡、CANN 9.2.1、Python 3.12.15、PyTorch 2.13.0+cpu、torch_npu 2.13.0（上游 067ee81975b0d1352afa8e9c4a49de1a52c8a5b8）。issue 说明已做多组对比实验（同一固定种子输入、同原生库与 op-plugin、每组独立进程与编译缓存，各 eager 参考梯度逐位一致），但帖子里没有给出反向分解的最终根因行号；复现脚本可 20 行内跑完，且不需要模型权重或外部数据。'
  source: https://gitcode.com/Ascend/pytorch/issues/6073
  behavior: 在 NPU 上用 torch.compile（DVM 后端）训练带 BatchNorm 的模型时，前向输出与 eager 完全一样、loss 第一步也对，但反传得到的输入梯度和 BN 权重梯度是错的：实测 x 梯度最大差 3.89、weight 梯度最大差 37.97，66% 元素超出 1e-4 容差。训练表现为 loss 能降但收敛轨迹与 eager 不一致、最终精度偏低，且不会有任何报错；只有对拍 eager 梯度或做梯度检查才能发现。
  trigger_surface: torch.compile + TORCHINDUCTOR_NPU_BACKEND=dvm；训练态 F.batch_norm（training=True、无 running stats）；Ascend 910B4、CANN 9.2.1、torch 2.13.0 + torch_npu 2.13.0。
  discovery: 2026-11-13 每日扫描
  notes: []

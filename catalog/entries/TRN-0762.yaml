title: TiledFusedLogitsLoss 忽略外部 loss 缩放致头梯度偏大
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 损失计算
    stack: deepspeed
    component: TiledFusedLogitsLoss
  behavior: 前向用 sum 归约，反向对 LM-head 梯度按 tile 求和但未乘外部归一化系数，head 梯度被放大有效 token 数倍。
effect:
  objects:
  - 梯度
  detail: output_reduction=sum 后除以有效 token 数 11：loss 误差 0、hidden grad 误差 1e-17，但 head.weight.grad 范数比 11.0，20/20 元素不符；CPU FP64 可复现。
  visibility: 静默错误
mitigation:
  detect: 对 loss 归一化/加权后的 head.weight.grad 与单卡参考梯度逐元素对拍。
  fix: 待定（issue open 2026-11-15，无修复 PR）

title: AsyncGRPO 前缀缓存跨权重同步保留旧权重 KV
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: AsyncGRPO 前缀缓存
  behavior: TRL 未按策略版本 salt 前缀缓存（SkyRL/prime-rl 已做），权重同步不失效前缀缓存：共享前缀的 rollout 部分基于陈旧策略 KV 计算，rollout↔train 一致性被破坏且不可观测（kl 指标本身被污染）。
effect:
  objects:
  - KV状态
  - 训练信号
  detail: AsyncGRPO 训练带长共享前缀（system prompt/工具 schema）时，权重同步后 rollout 仍用最初权重算出的前缀 KV；实测 KL 虚高 80 倍（0.082 vs 0.0010）、采样掩码错误率 3.2%；训练照常、指标看似合理，on-policy 假设被静默破坏。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（SkyRL/prime-rl 的 cache_salt 方案可借鉴；TRL 侧未见修复 PR）

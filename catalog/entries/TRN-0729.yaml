original:
  mechanism: 'cann/ops-nn issue #8599（2026-11-11 open）+ 加固 PR !14145（open）。GNTrainingReduce（arch35，Ascend 950PR/950DT，CANN 9.0.0）四类缺陷：1) TilingForGNTrainingReduce 无元素总数门限，cacheline/rIMax/aUnitMax 预算判定为 product*axisSize>limit 乘法式，超大 shape 中间结果 int64 回绕，超限 shape 静默放过并产出回绕 tiling；2) InferShape 的 num_groups>=1 校验位于 IsUnknownRank 早退后，x=[-2] 时 G=0 不被拒绝；3) Σx 补偿归约（double-double two-sum）的向量化尾块用运行期 UpdateMask 掩码，实测在 shape 特化编译产物中整块失效，尾块参与错误求和；4) group 分支把原始 workspace 交 InitGroup，而 950 运行时在 workspace 头部保留 16MB 系统区（RESERVED_WORKSPACE，ffts 跨核同步 mailbox 在该区），带 SyncAll 硬同步直绑会踩 mailbox。另有 UnknownShapeFormat 与 Format 声明不一致、golden 单链 O(R) 累加噪声 33~99 ULP 超预算。修复 !14145：元素总数门限+确定性拒绝、尾项标量 two-sum 续算+编译期常量掩码、group 分支绑用户 workspace 起始、golden 8192 分块成对合并。来源：https://gitcode.com/cann/ops-nn/issues/8599 、修复 https://gitcode.com/cann/ops-nn/pull/14145 。训练面：GroupNorm 训练统计量算子，训练前向/更新路径直接消费。'
  source: https://gitcode.com/cann/ops-nn/issues/8599 ｜修复 PR：https://gitcode.com/cann/ops-nn/pull/14145
  behavior: 950PR/950DT 上跑 GroupNorm 训练：特定尾块形状（归约长度非整向量宽）下 batch 统计量的补偿归约按失效掩码求和，统计量与梯度用的均值/方差静默偏差；构造超大 shape 时 tiling 预算回绕后照常下发错误执行计划；group 分支可能踩跨核同步 mailbox。均无报错；缺陷证据为源码定位+随 PR 新增 UT（RejectNonZeroDimProductOverflow 等），无端到端训练任务影响实测。
  trigger_surface: Ascend 950PR/950DT（arch35），CANN 9.0.0；尾块 rProd%8==0 且 rProd<64、超大 shape、group 分支 SyncAll；修复 !14145 open 未发布
  discovery: 2026-11-12 每日扫描
  notes:
  - '2026-11-13 2026-11-13 回访：源 issue #8599 已 closed（2026-11-12 索引 state=closed），关联修复 !14145 未见 merged 标记；机制判定不变。'

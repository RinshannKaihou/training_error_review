id: TRN-0723
legacy_ids: []
slug: megatron_swiglu_gtp_ckpt_gate_up_region_misorder
aliases: []
title: SwiGLU GTP 分片 ckpt 转换 gate/up 区域错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: megatron-lm
    component: SwiGLU ckpt 工厂
  behavior: ckpt 工厂假设本地 FC1 是 gate 半段接 up 半段（普通 TP 布局）；GTP 对 TP 本地对连续再切，一个分片可只含 gate 或只含 up 行，复用普通 TP 映射把行写进错误 gate/up 区域
effect:
  objects:
  - 模型权重
  detail: GTP 权重重切训练 SwiGLU/MoE 并把 ckpt 转换到不同 TP/GTP 组合时，转换出的 ckpt 里 FC1 的 gate 行与 up 行部分放错位置（示例：四分之二的行互换区域）；转换不报错、大小正常，加载后模型看似能跑但权重已错位，loss 异常时难以怀疑到 ckpt 布局。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/9265 （open，未合入）

id: TRN-0683
legacy_ids: []
slug: ds_gptbigcode_kv_rows_double_counted_clip
aliases: []
title: TP 下 GPTBigCode K/V 复制行范数重复计数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: clip_grad_norm 复制行标记
  behavior: 融合 attention 投影的 K/V 行在每个 TP rank 都存在，clip 范数的 all-reduce 把每份都加进去；K/V 行跨 rank 是同一份复制而非互斥分片
effect:
  objects:
  - 梯度
  detail: TP>1 且 K/V 占比越高，报告范数越大、clip_coef 被压小，有效更新比单卡弱，多卡结果与单卡不可比；梯度值本身与单卡一致，无报错或指标异常。
  visibility: 静默错误
mitigation:
  detect: 同一步 TP>1 vs TP=1 对比 clip_coef/grad_norm（梯度值应相同、范数偏大）
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/9030（open，未发布）：融合层 weight/bias 记录首复制行/行数/TP world size，范数累加按复制标记去重

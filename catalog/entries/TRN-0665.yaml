    component: rtsq_a5 轮询锚点
  behavior: baseSqHead_ 由数据面线程写、后台轮询线程读（约 10ms），非 atomic 无屏障；ARMv8 弱序允许读序重排，先读锚点再读硬件头的顺序无保证；环满等待锚点无刷新者、守卫无自愈。

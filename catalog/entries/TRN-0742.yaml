cause:
  objects:
  - subsystem: RL训练回路
    stack: openrlhf
    component: k3 KL 估计器
  behavior: actor 与参考 logprob 接近时 k3 的 FP32 表达式 exp(-d)-1+d 发生相减消去，前向值变负或梯度舍入为 0。
effect:
  objects:
  - 训练信号
  detail: CPU 复现：k3 从 -4.47e-8 修到 +1.36e-13（FP64 参考同值）；KL 项梯度由 0 变 -2.98e-11 与 FP64 一致——近 on-policy 时 KL 正则静默失效或符号错。
  visibility: 静默错误
mitigation:
  detect: k3 对近零 d 的 FP64 参考回归（近 on-policy 用例）；KL 系数非零但 KL 梯度范数恰为 0 的告警
  fix: 修复 PR https://github.com/OpenRLHF/OpenRLHF/pull/1406（open）：改 expm1(-d)+d，|d|<1e-3 用三阶泰勒展开稳定前向值与梯度；62 CPU 测试通过

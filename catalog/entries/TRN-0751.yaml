mitigation:
  detect: 在 batch-invariant 进程里对 addmm 用 fp64 参考对拍（含 strided/多维 bias 与 alpha/beta）；用 launch spy 检查 A_LARGE/B_LARGE/C_LARGE 是否按最大元素偏移置位
  fix: '修复 PR https://github.com/NVIDIA/Megatron-LM/pull/9305 （open，堆叠在 #8957/#8867 之上）：按 stride 取 bias、支持任意可广播 bias 与 alpha/beta、按最大元素偏移选 64 位'

  behavior: cmp_mask_mode=3 且给 cmp_topk_length 时，metadata 忽略逐行实际长度按 indices 宽度规划，主内核按实际长度执行——FA/FD 分块规划与执行不一致，产出 NaN 与 Inf LSE。
